name: Build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      args:
        required: true
        type: string
      triple:
        required: true
        type: string

env: {}

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install uv
        if: runner.os == 'macOS'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: install uv (Windows)
        if: runner.os == 'Windows'
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: powershell

      - name: install python dependencies
        working-directory: scraper
        run: uv sync

      - name: bundle standalone scraper binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cd scraper
          uv run pyinstaller --onefile --name anicat-scraper \
            --hidden-import curl_cffi \
            --hidden-import selectolax \
            --collect-all curl_cffi \
            --collect-all selectolax \
            main.py
          mkdir -p ../web/src-tauri/resources/scraper-bin
          mv dist/anicat-scraper ../web/src-tauri/resources/scraper-bin/
          cd ..

      - name: bundle standalone scraper binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd scraper
          uv run pyinstaller --onefile --name anicat-scraper --console \
            --hidden-import curl_cffi \
            --hidden-import selectolax \
            --collect-all curl_cffi \
            --collect-all selectolax \
            main.py
          mkdir -p ../web/src-tauri/resources/scraper-bin
          cp dist/anicat-scraper.exe ../web/src-tauri/resources/scraper-bin/
          cd ..

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.triple }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            web/src-tauri -> target

      - name: install frontend dependencies
        run: cd web && npm ci

      - name: Cache MPV binaries
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: |
            web/src-tauri/resources/mpv
            web/src-tauri/resources/mpv_config
            web/src-tauri/resources/lib
          key: mpv-${{ runner.os }}-${{ hashFiles('scripts/setup_bundled_player.sh', 'scripts/setup_bundled_player_windows.ps1') }}

      - name: Create cross-platform resource placeholders
        run: |
          mkdir -p web/src-tauri/resources web/src-tauri/resources/lib
          touch web/src-tauri/resources/mpv
          touch web/src-tauri/resources/mpv.exe
          touch web/src-tauri/resources/lib/.gitkeep

      - name: Setup Bundled Player Companion (macOS)
        if: runner.os == 'macOS' && steps.cache-mpv.outputs.cache-hit != 'true'
        run: chmod +x ./scripts/setup_bundled_player.sh && ./scripts/setup_bundled_player.sh

      - name: Setup Bundled Player Companion (Windows)
        if: runner.os == 'Windows' && steps.cache-mpv.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          if (Test-Path "./scripts/setup_bundled_player_windows.ps1") { ./scripts/setup_bundled_player_windows.ps1 }

      - name: Ensure resources directories exist
        run: mkdir -p web/src-tauri/resources/lib web/src-tauri/resources/mpv_config

      - name: Create cross-platform resource placeholders
        run: |
          touch web/src-tauri/resources/mpv
          touch web/src-tauri/resources/mpv.exe

      - name: build frontend
        working-directory: web
        run: npm run build

      - name: build tauri app
        working-directory: web
        run: npm run tauri build

      - name: upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'macOS' && 'macos-bundle' || 'windows-bundle' }}
          path: |
            web/src-tauri/target/release/bundle/
          if-no-files-found: warn
