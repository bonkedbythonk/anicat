name: Build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      args:
        required: true
        type: string
      triple:
        required: true
        type: string
      release-tag:
        type: string
        default: ''
      release-name:
        type: string
        default: ''
      release-body:
        type: string
        default: ''
      prerelease:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install uv
        if: runner.os == 'macOS'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: install uv (Windows)
        if: runner.os == 'Windows'
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: powershell

      - name: install python dependencies
        run: uv sync

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.triple }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            web/src-tauri -> target

      - name: install frontend dependencies
        run: cd web && npm ci

      - name: Cache MPV binaries
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: web/src-tauri/resources/mpv*
          key: mpv-${{ runner.os }}-${{ hashFiles('scripts/setup_bundled_player.sh', 'scripts/setup_bundled_player_windows.ps1') }}

      - name: Setup Bundled Player Companion (macOS)
        if: runner.os == 'macOS' && steps.cache-mpv.outputs.cache-hit != 'true'
        run: chmod +x ./scripts/setup_bundled_player.sh && ./scripts/setup_bundled_player.sh

      - name: Setup Bundled Player Companion (Windows)
        if: runner.os == 'Windows' && steps.cache-mpv.outputs.cache-hit != 'true'
        run: ./scripts/setup_bundled_player_windows.ps1
        shell: powershell

      - name: build frontend
        working-directory: web
        run: npm run build

      - uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          tagName: ${{ inputs.release-tag }}
          releaseName: ${{ inputs.release-name }}
          releaseBody: ${{ inputs.release-body }}
          releaseDraft: true
          prerelease: ${{ inputs.prerelease || inputs.nightly }}
