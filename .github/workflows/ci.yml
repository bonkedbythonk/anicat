name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: cargo clippy
        working-directory: core
        run: cargo clippy --lib --tests -- -D warnings

      # Tests that hit the network are #[ignore]d and stay that way here.
      - name: cargo test
        working-directory: core
        run: cargo test --lib

  apple:
    name: Swift package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      # Produces Frameworks/AnicatCore.xcframework and the generated Swift
      # bindings, none of which are committed.
      - name: Build xcframework
        run: bash scripts/build-xcframework.sh

      - name: swift build
        working-directory: AnicatApple
        run: swift build --product Anicat

      # AnicatUI compiles for the iOS Simulator since 2026-09-06 and has to
      # stay that way; AppKit leaking into a shared view only shows up here.
      - name: swift build (iOS Simulator)
        working-directory: AnicatApple
        run: swift build --product AnicatUI --triple arm64-apple-ios17.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path .build-ios

      # The compile check above builds a library and stops there: it never
      # links an executable, never reads Info.plist and never produces a
      # bundle, so a missing product dependency, a malformed plist key or a
      # target that cannot bundle all pass it. Only building the app catches
      # those, and the project is generated rather than committed, so CI has
      # to run xcodegen before it can build anything.
      - name: Build the iOS app
        working-directory: AnicatApple
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Anicat.xcodeproj -scheme AnicatiOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-xcode \
            CODE_SIGNING_ALLOWED=NO build

      # Not `swift test`: several suites call the live AniList API and fail
      # outright during its outages, which would make CI red for reasons
      # unrelated to the change.
