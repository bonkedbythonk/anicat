name: CI

on:
  pull_request:
  push:
    branches: [master, nightly]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

  backend:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux build dependencies (the app targets macOS, but cargo
      # check needs these for the tauri crate's build scripts to resolve).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      # Tauri's build script validates that bundled resource paths exist.
      # These binaries are macOS-only and not committed; stub them for CI.
      - name: Stub resource paths
        run: |
          mkdir -p web/src-tauri/resources/mpv_config/scripts/anicat_ui
          mkdir -p web/src-tauri/resources/scraper-bin
          touch web/src-tauri/resources/mpv
          touch web/src-tauri/resources/mpv.exe

      - name: cargo check
        working-directory: web/src-tauri
        run: cargo check
