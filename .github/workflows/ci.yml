name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: cargo clippy
        working-directory: core
        run: cargo clippy --lib --tests -- -D warnings

      # Tests that hit the network are #[ignore]d and stay that way here.
      - name: cargo test
        working-directory: core
        run: cargo test --lib

      # publish-release.sh refuses to build on a stale notices file, but the
      # nightly does not run that script, so it shipped stale notices
      # unchecked. The generator reads license texts out of the cargo
      # registry, hence the fetches (all targets: the Windows crate's
      # Windows-only dependencies are part of the file).
      - name: Third-party notices are current
        run: |
          (cd core && cargo fetch --locked)
          (cd server && cargo fetch --locked)
          python3 scripts/generate-third-party-notices.py --check

      # The two workers' own test files, otherwise run by nobody.
      - name: Worker tests
        run: |
          node --test services/tmdb-proxy/worker.test.mjs
          node --test services/release-mirror/worker.test.mjs

  apple:
    name: Swift package
    # macos-26, not macos-15: the image's Xcode decides the Swift version, and
    # macos-15 tops out a generation behind what this project is developed,
    # packaged and released on. The gap is not academic -- 6.3 infers that a
    # `queue: .main` callback is the main actor and the older compiler does
    # not, so main-actor writes, generated uniffi records and notification
    # closures were all rejected here while every local build was green. CI
    # that disagrees with the toolchain the release is cut with reports on a
    # build nobody ships.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-tvos,aarch64-apple-tvos-sim

      # MPVKit's static xcframeworks are about 1.7 GB and SwiftPM unpacks
      # them into .build/artifacts on resolve; without this every Apple job
      # and every nightly downloaded them again. Keyed on Package.resolved,
      # so an MPVKit bump misses the cache and nothing stale is linked.
      - uses: actions/cache@v4
        with:
          path: |
            AnicatApple/.build/artifacts
            AnicatApple/.build/checkouts
            AnicatApple/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ hashFiles('AnicatApple/Package.resolved') }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      # Produces Frameworks/AnicatCore.xcframework and the generated Swift
      # bindings, none of which are committed.
      - name: Build xcframework
        run: bash scripts/build-xcframework.sh

      - name: swift build
        working-directory: AnicatApple
        run: swift build --product Anicat

      # AnicatUI compiles for the iOS Simulator since 2026-09-06 and has to
      # stay that way; AppKit leaking into a shared view only shows up here.
      - name: swift build (iOS Simulator)
        working-directory: AnicatApple
        run: swift build --product AnicatUI --triple arm64-apple-ios18.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path .build-ios

      # Same check for Apple TV. The TV root is its own set of views behind
      # `#if os(tvOS)`, but everything under it -- the model, the player
      # controller, the caches, the design system -- is shared, and the
      # tvOS SDK is missing things the iOS one has (no WebKit, no
      # `DragGesture`, no `Slider`, no haptics, no pasteboard). A shared
      # file reaching for one of those only shows up here.
      - name: swift build (tvOS Simulator)
        working-directory: AnicatApple
        run: swift build --product AnicatUI --triple arm64-apple-tvos18.0-simulator --sdk "$(xcrun --sdk appletvsimulator --show-sdk-path)" --scratch-path .build-tvos

      # The compile check above builds a library and stops there: it never
      # links an executable, never reads Info.plist and never produces a
      # bundle, so a missing product dependency, a malformed plist key or a
      # target that cannot bundle all pass it. Only building the app catches
      # those, and the project is generated rather than committed, so CI has
      # to run xcodegen before it can build anything. `ARCHS=arm64` because a
      # generic simulator destination asks for x86_64 as well, and
      # build-xcframework.sh prelinks aarch64 targets only — the link then
      # fails on a slice no runner needs.
      - name: Build the iOS app
        working-directory: AnicatApple
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Anicat.xcodeproj -scheme AnicatiOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-xcode \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      # And the Apple TV app, from the same generated project. This is the
      # step that reads Info-tvOS.plist and compiles the brand assets
      # (layered icon plus Top Shelf image), neither of which the library
      # build above touches.
      - name: Build the tvOS app
        working-directory: AnicatApple
        run: |
          xcodebuild -project Anicat.xcodeproj -scheme AnicatTV \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath .build-xcode \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      # The offline suites. The three that call the live AniList API
      # (BridgeTests, RealDataWiringTests, EngineBridgeTests) skip themselves
      # unless ANICAT_LIVE=1 is set, which it is not here: they went red
      # through every AniList outage for reasons unrelated to the change.
      - name: swift test
        working-directory: AnicatApple
        run: swift test

  windows:
    name: Windows server
    # It exists so a change made and checked on a Mac cannot break the
    # Windows build unseen. Cross-compiling from macOS dies
    # in aws-lc-sys's C build (tried 2026-09-12), so a Mac session has no
    # other way to find out. The toolchain matches
    # scripts/setup-windows-dev.ps1; the runner image already carries the
    # Build Tools and CMake.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # aws-lc-sys (librqbit's rust-tls) assembles with NASM on Windows and
      # the image does not ship it; without it the build stops in
      # aws-lc-sys before any Rust compiles.
      - uses: ilammy/setup-nasm@v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: cargo test --locked
        working-directory: server
        run: cargo test --locked

      - name: cargo build --release --locked
        working-directory: server
        run: cargo build --release --locked
