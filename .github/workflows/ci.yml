name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

  backend:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux build dependencies (the app targets macOS, but cargo
      # check needs these for the tauri crate's build scripts to resolve).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      # Tauri's build script validates that bundled resource paths exist.
      # resources/mpv, resources/mpv.exe, resources/lib/, and the PyInstaller
      # --onedir scraper output under resources/scraper-bin/ are all
      # gitignored (built at package time); stub them for CI.
      - name: Stub resource paths
        run: |
          touch web/src-tauri/resources/mpv
          touch web/src-tauri/resources/mpv.exe
          mkdir -p web/src-tauri/resources/lib
          touch web/src-tauri/resources/lib/.gitkeep
          mkdir -p web/src-tauri/resources/scraper-bin/anicat-scraper/_internal
          touch web/src-tauri/resources/scraper-bin/anicat-scraper/anicat-scraper
          touch web/src-tauri/resources/scraper-bin/anicat-scraper/_internal/.gitkeep

      - name: cargo clippy
        working-directory: web/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: web/src-tauri
        run: cargo test --lib

  scraper:
    name: Scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Run parser tests
        working-directory: scraper
        run: uv run --group dev pytest -q
