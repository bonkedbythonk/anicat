name: Build Nightly
on:
  push:
    branches:
      - nightly
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            triple: x86_64-pc-windows-msvc
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.target.platform }}
      args: ${{ matrix.target.args }}
      triple: ${{ matrix.target.triple }}
      release-tag: nightly
      release-name: Anicat Nightly
      release-body: Nightly build from the latest commit on the nightly branch.
      prerelease: true
      nightly: true
