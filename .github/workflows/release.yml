name: Release
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Tag to release (e.g. v5.0.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag-name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(jq -r .version web/src-tauri/tauri.conf.json)
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi
      - name: Check if release already exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.release-tag.outputs.tag }}
          if gh release view "$TAG" --json tagName --jq '.tagName' 2>/dev/null; then
            echo "Release $TAG already exists — skipping duplicate build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.target.platform }}
      args: ${{ matrix.target.args }}
      triple: ${{ matrix.target.triple }}

  release:
    needs: [check, build]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-bundle'
          path: dist
          merge-multiple: true

      - name: create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ needs.check.outputs.tag }}
          find dist -name "*.app" -prune -o -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) -exec mv {} . \;
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Anicat $TAG" \
            --notes "See the assets below to download the latest version of Anicat."
          shopt -s nullglob
          gh release upload "$TAG" *.dmg *.exe *.msi *.zip --clobber
