name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if release already exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if gh release view "$TAG" --json tagName --jq '.tagName' 2>/dev/null; then
            echo "Release $TAG already exists — skipping duplicate build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
            sidecar_suffix: ''
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            triple: x86_64-pc-windows-msvc
            sidecar_suffix: '.exe'
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.target.platform }}
      args: ${{ matrix.target.args }}
      triple: ${{ matrix.target.triple }}
      sidecar_suffix: ${{ matrix.target.sidecar_suffix }}
      release-tag: ${{ github.ref_name }}
      release-name: Anicat ${{ github.ref_name }}
      release-body: See the assets below to download the latest version of Anicat.
      prerelease: false
