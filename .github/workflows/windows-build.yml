name: Windows Build

# Manual trigger (Actions tab -> Run workflow) or on a version tag.
# Produces a downloadable Windows installer so the app can be tested without a
# local toolchain.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # The frontend build step shells out to `python3`; GitHub's Windows
      # runners expose `python` but not always `python3`. Make a shim next to it.
      - name: Ensure python3 shim
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $py = (Get-Command python).Source
            Copy-Item $py (Join-Path (Split-Path $py) "python3.exe") -Force
          }
          python3 --version

      # mpv is bundled into the app. Chocolatey is preinstalled on the runner;
      # grab the package and copy the real mpv.exe (+ its folder) into resources.
      - name: Fetch and bundle mpv
        shell: pwsh
        run: |
          choco install mpv -y --no-progress
          # The real binaries land under lib\mpvio.install\tools, not lib\mpv;
          # search the whole choco lib tree for mpv.exe.
          $mpv = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse -Filter mpv.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mpv) { throw "mpv.exe not found after choco install" }
          Write-Host "Found mpv at $($mpv.FullName)"
          New-Item -ItemType Directory -Force -Path web/src-tauri/resources | Out-Null
          New-Item -ItemType Directory -Force -Path web/src-tauri/resources/lib | Out-Null
          Copy-Item $mpv.FullName web/src-tauri/resources/mpv.exe -Force
          # Copy any sibling DLLs so mpv finds them via the lib dir we add to PATH.
          Get-ChildItem -Path $mpv.Directory -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName web/src-tauri/resources/lib/ -Force
          }
          # Tauri's resource globs expect these to exist even if empty.
          New-Item -ItemType File -Force -Path web/src-tauri/resources/mpv | Out-Null

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # Runs beforeBuildCommand (npm run build -> scraper freeze via uv +
      # tsc + vite) and then bundles the installer. NSIS only — WiX/MSI is the
      # flaky bundler on CI and NSIS is enough for testing.
      - name: Build app
        working-directory: web
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: anicat-windows-installer
          path: web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
