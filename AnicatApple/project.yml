# The iOS and tvOS app targets. SwiftPM cannot emit an iOS or tvOS `.app` —
# it builds frameworks and command-line executables only — so the phone and
# TV builds need an Xcode project even though every line of source they
# compile already lives in this package. Generated with `xcodegen generate`
# rather than committed: a hand-edited .xcodeproj is 3000 lines of
# unreviewable XML that conflicts on every branch, and there is nothing in
# it a human should be authoring.
#
# The macOS app does NOT come through here. It is still
# `swift build --product Anicat` plus scripts/package-anicat-macos-app.sh;
# adding it would mean two descriptions of one target that drift apart.
name: Anicat
options:
  bundleIdPrefix: com.anicat
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true

packages:
  # The package this project sits inside. Xcode resolves a local package by
  # path, so there is no version to pin and no checkout: the project always
  # builds the working tree, which is the point.
  AnicatApple:
    path: .

targets:
  AnicatiOS:
    type: application
    platform: iOS
    sources:
      # The same entry file the macOS executable target uses. Its macOS half
      # is behind `#if os(macOS)`, so on iOS this compiles down to the scene
      # in the `#else` branch and nothing else.
      - path: Sources/AnicatApp
      # Home-screen icon. Generated from assets/branding/icon.icns, the same
      # art the macOS packaging script installs, so the two platforms cannot
      # drift. It lives outside the SwiftPM target's resources on purpose:
      # an app icon has to be compiled into the *app* by actool, and a
      # package resource bundle is not where iOS looks for it.
      - path: Sources/AnicatUI/Resources/AppIcon.xcassets
    dependencies:
      - package: AnicatApple
        product: AnicatUI
      - package: AnicatApple
        product: AnicatCoreKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Anicat
        CFBundleShortVersionString: 6.0.1
        CFBundleVersion: "1"
        # Playback must survive the screen locking or the app leaving the
        # foreground; without this the audio session is torn down the moment
        # the user pockets the phone mid-episode.
        UIBackgroundModes:
          - audio
        # librqbit talks to peers on the local subnet and BonjourDiscovery
        # advertises/browses `_anicat-stream._tcp`. iOS 14 and later refuse
        # both silently — no error, just no peers — unless the app declares
        # why it wants the local network.
        NSLocalNetworkUsageDescription: >-
          Anicat finds other Anicat instances on your network and connects to
          nearby peers while streaming.
        NSBonjourServices:
          - _anicat-stream._tcp
        # The player is landscape; everything else is portrait. Upside-down
        # is left out because a phone rotated 180 degrees mid-episode is an
        # accident, not an intention.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # An empty launch-screen dictionary is what opts the app into the
        # full screen. With no UILaunchScreen key at all iOS assumes a
        # pre-iPhone-X app and letterboxes it inside black bars.
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # How cinema mode reaches TMDB. The literal URL, not ${ANICAT_TMDB_PROXY}:
        # xcodegen leaves an unset variable in the plist verbatim, so every
        # build generated without that export shipped a proxy base URL of
        # "${ANICAT_TMDB_PROXY}" -- cinema mode read as available and every
        # request went to a hostname that does not exist. No key ships with
        # it; the key lives on the worker (services/tmdb-proxy), which is the
        # only arrangement where a public repo and a working cinema mode are
        # the same build. A viewer's own key still wins, from Settings.
        ANICATTMDBProxy: https://anicat-tmdb.anicat.workers.dev
        # Without these the phone build is unreachable from outside itself:
        # `anicat://title/<id>` is refused by LaunchServices, and Handoff
        # from the Mac arrives as an activity type the app never claimed.
        # The macOS bundle has carried both for a while; the iOS target
        # started without them because nothing generated its plist before.
        CFBundleURLTypes:
          - CFBundleURLName: Anicat
            CFBundleURLSchemes: [anicat]
        NSUserActivityTypes:
          - com.anicat.playback
          - com.anicat.reading
        # Without this the Live Activity request fails silently -- there is
        # no error, `Activity.request` simply throws and the lock screen
        # stays empty.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicat.ios
        # iPhone only. iPad would inherit the 200pt-rail desktop layout,
        # which is the one thing this port is replacing.
        TARGETED_DEVICE_FAMILY: "1"
        # Read from the environment, not written here. A Team ID is not a
        # credential -- it cannot sign anything without the private key --
        # but it is the one stable handle that ties this pseudonymous repo
        # to a named Apple developer account, and DISCLAIMER.md says that
        # name stays private. It also cannot be rotated if it ever leaks.
        # Set ANICAT_DEVELOPMENT_TEAM in your shell before `xcodegen
        # generate`; unset it and generation still succeeds, which is what
        # CI does, since it builds with CODE_SIGNING_ALLOWED=NO.
        DEVELOPMENT_TEAM: ${ANICAT_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The Apple TV app. Same entry file and the same two package products as
  # the phone; `AnicatApp.swift` mounts `TVRootView` under `#if os(tvOS)`.
  AnicatTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/AnicatApp
      # tvOS icons are layered image stacks plus a Top Shelf image, in a
      # `.brandassets` catalog rather than an `.appiconset`. Generated from
      # the same 1024px art as the iOS icon (single layer, on the Ink
      # ground) so the platforms cannot drift. Outside the SwiftPM
      # resources for the same reason the iOS icon is: actool has to
      # compile it into the app, not into a resource bundle.
      - path: Sources/AnicatUI/Resources/AppIconTV.xcassets
    dependencies:
      - package: AnicatApple
        product: AnicatUI
      - package: AnicatApple
        product: AnicatCoreKit
    info:
      path: Generated/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Anicat
        CFBundleShortVersionString: 6.0.1
        CFBundleVersion: "1"
        # Playback keeps going while another app has the screen? No: a TV
        # has no pocket. What the audio background mode buys here is that
        # the AVAudioSession survives the app being sent to the background
        # by a Siri interruption, which is the same session teardown the
        # phone hits on lock.
        UIBackgroundModes:
          - audio
        # See the iOS target: librqbit talks to peers on the local subnet
        # and BonjourDiscovery advertises `_anicat-stream._tcp`; tvOS
        # refuses both silently without the declaration.
        NSLocalNetworkUsageDescription: >-
          Anicat finds other Anicat instances on your network and connects to
          nearby peers while streaming.
        NSBonjourServices:
          - _anicat-stream._tcp
        ITSAppUsesNonExemptEncryption: false
        # The literal URL, not ${ANICAT_TMDB_PROXY}; see the iOS target.
        ANICATTMDBProxy: https://anicat-tmdb.anicat.workers.dev
        # `anicat://title/<id>` reaches the TV the same way it reaches the
        # phone. Handoff does not exist on tvOS, so no activity types.
        CFBundleURLTypes:
          - CFBundleURLName: Anicat
            CFBundleURLSchemes: [anicat]
        # The Ink palette is the one the TV is drawn for; a light system
        # appearance on a television reads as a white wall. Themes that
        # carry a light side are still selectable in Settings, which
        # `ThemedRoot` applies through SwiftUI's own colour scheme.
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicat.tv
        # Apple TV only.
        TARGETED_DEVICE_FAMILY: "3"
        DEVELOPMENT_TEAM: ${ANICAT_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

