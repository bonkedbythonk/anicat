[package]
name = "anicat-core"
version = "1.1.0"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "anicat_core"
# staticlib for the Apple xcframework, cdylib for uniffi-bindgen's own
# library-mode inspection, rlib so `cargo test` can link the crate normally.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["tokio", "cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# gzip: with default-features off nothing sent Accept-Encoding, so every
# AniList page, TMDB row, Nyaa RSS feed and MangaDex chapter list came down
# uncompressed; the largest AniList home response is ~400 KB of JSON. Not
# brotli: it drags in alloc-stdlib, which ships no license file and would
# need a hand-kept exception in the notices generator, for servers that all
# speak gzip anyway.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
chrono = "0.4"
axum = "0.8"
bytes = "1"
http = "1"
futures-util = "0.3"
thiserror = "2"
regex-lite = "0.1"
dirs = "6"
tokio-util = { version = "0.7", features = ["io"] }
discord-rich-presence = "1.1"
# Installed by `AnicatEngine::new` so core's `log::` lines reach stderr in
# the app. Nothing else routed them anywhere: every `[resolve]` timing line
# was being dropped on the floor in the Swift build.
env_logger = "0.11"
# disable-upload: this is a personal streaming client, not a seedbox — we
# download to watch and never upload. Also silences the bulk of the peer
# churn that librqbit logs.
# default-features off + rust-tls: librqbit's default "default-tls" feature
# enables reqwest/default-tls (native-tls) crate-graph-wide, which flips
# reqwest::Client::new() from rustls to macOS SecureTransport. Some hosts'
# handshakes fail under SecureTransport (api.aniskip.com did, silently,
# when core still called it). Keep the whole crate on rustls.
librqbit = { version = "8", default-features = false, features = ["disable-upload", "rust-tls"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# librqbit with two changes, each marked "anicat patch". In
# vendor/librqbit/src/torrent_state/mod.rs, a torrent whose file path has any
# part other than a plain name is refused (a "C:x.dll" part escaped the
# download folder on Windows). In
# vendor/librqbit/src/torrent_state/live/mod.rs: a peer may take over the
# piece a stream is blocked on once its holder has been at it longer than the
# taker needs for a whole piece. Upstream (8.1.1 and 9.1.0 alike) gives each
# piece to one peer and lets another steal it only past 10x its own average
# piece time; with 16 MiB pieces a slow peer held the piece mpv needed for
# 64.4s on the phone while 64 MiB of later pieces landed from faster ones.
#
# librqbit-tracker-comms with one change, marked "anicat patch" in
# vendor/librqbit-tracker-comms/src/tracker_comms_udp.rs: a failed UDP
# receive backs off instead of retrying at once. After the Apple TV slept the
# socket failed with ENOTCONN forever and the loop logged ~200,000 lines a
# second.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
