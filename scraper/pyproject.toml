[project]
name = "anicat-scraper"
version = "5.0.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "curl_cffi>=0.15",
    "selectolax>=0.3",
    "pyinstaller>=6",
    "nodriver>=0.40",
    "pycryptodome>=3.20.0",
    "ebooklib>=0.18",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
