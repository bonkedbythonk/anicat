[package]
name = "anicat-server"
# Not the app's version. `bump-version.sh` rewrites version.txt and core's
# manifest, never this file; the binary reads version.txt at compile time
# (see `version.rs`), so a bump cannot leave the server reporting the last
# release.
version = "0.0.0"
license = "GPL-3.0-only"
edition = "2021"
publish = false

[[bin]]
name = "anicat"
path = "src/main.rs"

[dependencies]
anicat-core = { path = "../core" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same feature set as core. With default features reqwest enables native-tls
# for the whole crate graph, which moves core's own clients off rustls; see
# the librqbit comment in core/Cargo.toml for what that broke.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
log = "0.4"
dirs = "6"
# The default browser, for the page on start and the tray's Open.
open = "5"

# Only where the build has a tray. Everywhere else the binary runs headless,
# and tray-icon's Linux backend would drag gtk and libappindicator into a
# crate nobody ships for Linux.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.23", default-features = false }
# The event loop tray-icon's docs name: the Win32 message loop the icon's
# hidden window needs on Windows, the NSApplication run loop a status item
# needs on macOS.
tao = "0.35"
png = "0.18"

[build-dependencies]
# The exe's own icon in Explorer and the taskbar. Does nothing off Windows.
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects"] }
