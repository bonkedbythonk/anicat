# Anicat's mpv defaults, loaded through --config-dir from the folder beside
# anicat.exe. A viewer's own %APPDATA%\mpv\mpv.conf is included after this
# file, so any line here can be overridden there. The options the player
# loop depends on (no idle, no keep-open, no watch-later resume) are passed
# on the command line instead, where a user config cannot undo them.

# Open the window at once, not when the first frame decodes: a torrent's
# first piece can take seconds, and with no window the play looked ignored.
force-window=immediate

hwdec=auto-safe
vo=gpu-next

# Anime releases: Japanese audio and English subtitles when both exist.
# A dub is chosen by picking a dub release, not by track order.
alang=ja,jpn,en,eng
slang=en,eng,enUS,en-US
sub-auto=fuzzy

# The range server is on loopback, so a larger read-ahead costs no network;
# it smooths over pieces that arrive in bursts.
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=60

screenshot-directory=~~desktop/
