<!doctype html>
<html lang="en" data-skin="ink" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anicat</title>
<script>
  // Before the stylesheet paints: a light-skin viewer otherwise sees one
  // frame of the dark ground on every load.
  (function () {
    var skin = "ink", follow = true, theme = "dark";
    try {
      skin = localStorage.getItem("anicat_skin") || "ink";
      follow = localStorage.getItem("anicat_follow_system") !== "0";
      theme = localStorage.getItem("anicat_theme") || "dark";
    } catch (e) { /* storage refused: defaults */ }
    if (follow) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    if (skin === "oled" || skin === "cyber") theme = "dark";
    document.documentElement.dataset.skin = skin;
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  /* The Sumi Ledger: ink or washi ground, one accent, hairlines, flat at
     rest. Values are the Mac app's SumiPalette (ThemeStore.swift), one rule
     per palette. --mute-a and --line-a are its mutedAlpha and borderAlpha;
     they differ per palette (OLED's hairline is 18% because 10% of the
     foreground over true black is 1.17:1 and every card loses its edge),
     so the tokens below are derived from them rather than hard-coded. */
  :root {
    --muted: color-mix(in srgb, var(--fg) var(--mute-a), transparent);
    --faint: color-mix(in srgb, var(--fg) calc(var(--mute-a) * .58), transparent);
    --line: color-mix(in srgb, var(--fg) var(--line-a), transparent);
    --gauge: var(--accent);
    --art: none;
    --r-sm: 6px; --r-md: 10px; --r-lg: 12px; --r-xl: 14px;
  }
  [data-theme=dark] { --danger: #e2674a; --ok: #8fb573; --warn: #d9a441; }
  [data-theme=light] { --danger: #a93a26; --ok: #4c6b35; --warn: #8c6310; }

  :root, [data-skin=ink][data-theme=dark] {
    color-scheme: dark;
    --bg: #161310; --card: #1e1a15; --card-2: #26211b; --fg: #ede7dc;
    --accent: #8fb8dc; --mute-a: 55%; --line-a: 10%;
    --shade: rgba(0, 0, 0, 0.45);
  }
  [data-skin=ink][data-theme=light] {
    color-scheme: light;
    --bg: #f1ece2; --card: #faf7f0; --card-2: #e9e3d6; --fg: #26221b;
    --accent: #2f5a76; --mute-a: 65%; --line-a: 14%;
    --shade: rgba(38, 34, 27, 0.18);
  }
  [data-skin=sakura][data-theme=dark] {
    color-scheme: dark;
    --bg: #180a10; --card: #201016; --card-2: #2b1620; --fg: #fcfafb;
    --accent: #e0607e; --mute-a: 55%; --line-a: 16%;
    --shade: rgba(0, 0, 0, 0.5);
  }
  [data-skin=sakura][data-theme=light] {
    color-scheme: light;
    --bg: #fdf5f7; --card: #ffffff; --card-2: #f6e6eb; --fg: #2d1822;
    --accent: #c04060; --mute-a: 65%; --line-a: 12%;
    --shade: rgba(45, 24, 34, 0.16);
  }
  [data-skin=royal][data-theme=dark] {
    color-scheme: dark;
    --bg: #0e0618; --card: #170b26; --card-2: #20142f; --fg: #f1eaff;
    --accent: #a66bff; --mute-a: 58%; --line-a: 16%;
    --shade: rgba(0, 0, 0, 0.5);
  }
  [data-skin=royal][data-theme=light] {
    color-scheme: light;
    --bg: #f5f0ff; --card: #ffffff; --card-2: #ece4fb; --fg: #1e1033;
    --accent: #5b1fd1; --mute-a: 65%; --line-a: 14%;
    --shade: rgba(30, 16, 51, 0.16);
  }
  /* Evangelion, stored as dusk like the Mac's skin id. --gauge is Unit-01 green,
     which only the segmented progress bars draw; every other skin's gauge is its accent. */
  [data-skin=dusk][data-theme=dark] {
    color-scheme: dark;
    --bg: #0c0a10; --card: #16121e; --card-2: #1f1c27; --fg: #f1ecf5;
    --accent: #ff6a13; --gauge: #7cff3a; --mute-a: 62%; --line-a: 16%;
    --shade: rgba(0, 0, 0, 0.5);
  }
  [data-skin=dusk][data-theme=light] {
    color-scheme: light;
    --bg: #f4efe8; --card: #ffffff; --card-2: #ece5da; --fg: #1c1230;
    --accent: #b84300; --gauge: #2a6f10; --mute-a: 68%; --line-a: 14%;
    --shade: rgba(28, 18, 48, 0.16);
  }
  [data-skin=cyber] {
    color-scheme: dark;
    --bg: #0a0a0f; --card: #14141c; --card-2: #1d1d24; --fg: #edede6;
    --accent: #fcee0a; --mute-a: 62%; --line-a: 16%;
    --shade: rgba(0, 0, 0, 0.6); --danger: #ff4d7a;
  }
  [data-skin=oled] {
    color-scheme: dark;
    --bg: #000000; --card: #0b0a09; --card-2: #16140f; --fg: #ede7dc;
    --accent: #8fb8dc; --mute-a: 58%; --line-a: 18%;
    --shade: rgba(0, 0, 0, 0.6);
  }
  /* Sakura is the one skin that changes anything but colour: headings and
     names go serif, as Font.sumiHeading does on the Mac. */
  [data-skin=sakura] :is(h1, h2, h3, .t-name) { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Yu Mincho", serif; }

  * { box-sizing: border-box; }
  /* Class rules below set display, which would otherwise beat the hidden
     attribute and leave an empty now-playing bar on screen. */
  [hidden] { display: none !important; }
  /* The ground is on html alone: a background on body too would paint over the
     page picture, which sits at z-index -1 behind the content. */
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--fg); }
  body {
    font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num, .meta, time { font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus { outline: none; }
  :focus-visible {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 0 4px var(--bg);
    border-radius: 8px;
  }
  img { color: transparent; }

  /* ---- buttons ---- */
  /* SumiButtonStyle: 28pt, 12pt semibold, a hairline on the card fill, the
     foreground wash on hover. Press dims to 85%; nothing on the Mac scales
     under the pointer. The primary is bold, and glows only on the neon skins'
     dark side (Royal Neon, Night City). */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 28px; cursor: pointer; white-space: nowrap;
    background: var(--card); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--r-md);
    padding: 0 14px; font-size: 12px; font-weight: 600; transition: background .15s, opacity .1s, box-shadow .15s;
  }
  .btn:hover { background: color-mix(in srgb, var(--fg) 10%, var(--bg)); }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--bg); box-shadow: none; font-weight: 700; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, var(--bg)); }
  [data-skin=royal][data-theme=dark] .btn.primary, [data-skin=cyber] .btn.primary { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent); }
  [data-skin=royal][data-theme=dark] .btn.primary:hover, [data-skin=cyber] .btn.primary:hover { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent); }
  /* The large size, for the one action the spotlight is for. */
  .hero .btn { min-height: 40px; padding: 0 16px; font-size: 12.5px; }
  .hero .btn.primary { padding: 0 20px; font-size: 13.5px; border-radius: var(--r-lg); }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--muted); padding: 0 8px; }
  .btn.ghost:hover { color: var(--fg); background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .link { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
  .link:hover { color: color-mix(in srgb, var(--accent) 80%, var(--fg)); }

  /* A slash toggle: the choices as words, the chosen one in ink. */
  .slash { display: inline-flex; align-items: baseline; gap: .1rem; font-size: 13px; }
  .slash button {
    background: none; border: 0; padding: .15rem .25rem; cursor: pointer; color: var(--faint);
    transition: color .15s;
  }
  .slash button:hover { color: var(--muted); }
  .slash button[aria-pressed=true] { color: var(--fg); font-weight: 600; }
  .slash .sep { color: var(--faint); user-select: none; }

  /* Text-menu dropdown. */
  /* SumiFilterDropdown: a hairline box, label muted, the value in a dim
     foreground until something is chosen and then in the accent on a 10%
     accent fill. */
  .menu-btn {
    display: inline-flex; align-items: center; gap: .35rem; background: none; border: 0; cursor: pointer; border-radius: var(--r-md);
    padding: 7px 12px; font-size: 12px; font-weight: 500; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line);
  }
  .menu-btn b { color: color-mix(in srgb, var(--fg) 60%, transparent); font-weight: 500; }
  .menu-btn.set { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
  .menu-btn.set b { color: var(--accent); }
  .menu-btn svg { width: 10px; height: 10px; opacity: .7; }
  .popover {
    position: fixed; z-index: 60; min-width: 180px; max-height: min(420px, 70vh); overflow: auto;
    background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line), 0 14px 40px var(--shade);
    padding: .3rem; animation: pop .14s ease-out;
  }
  .popover button {
    display: flex; width: 100%; align-items: center; gap: .5rem; text-align: left; background: none; border: 0;
    padding: .42rem .65rem; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .popover button:hover, .popover button.hot { background: var(--card-2); }
  .popover button[aria-checked=true] { color: var(--accent); font-weight: 600; }
  .popover button.danger { color: var(--danger); }
  .popover .sep { height: 1px; background: var(--line); margin: .3rem .45rem; }
  .popover .head { font-size: 11.5px; color: var(--faint); padding: .35rem .65rem .15rem; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

  input.field, textarea.field {
    background: var(--card); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 10px;
    padding: .6rem .8rem; width: 100%;
  }
  input.field:focus-visible, textarea.field:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); border-radius: 10px; }
  textarea.field { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 12px; min-height: 12rem; }

  /* ---- shell ---- */
  /* The Mac rail (SidebarView.swift): 200pt, words only, Browse and System
     captions, a rounded wash inset from the edges where a source list marks
     its row, the paw as a 10% watermark and a Search anything row at the foot.
     It had icons and a 3px accent bar, which the Mac dropped as an
     admin-dashboard nav. */
  .shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
  aside.side {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: .75rem 0 1rem;
    background: var(--card); box-shadow: inset -1px 0 0 var(--line);
  }
  nav.nav { display: flex; flex-direction: column; padding-bottom: 8px; }
  nav.nav .grp { font-size: 11.5px; color: var(--muted); padding: 16px 20px 6px; font-variant-numeric: tabular-nums; }
  nav.nav a {
    display: flex; align-items: center; margin: 0 8px; padding: 7px 8px 7px 12px; min-height: 37px; border-radius: var(--r-sm);
    color: color-mix(in srgb, var(--fg) 70%, transparent); font-size: 13px; transition: color .15s, background .15s;
  }
  nav.nav a:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 4%, transparent); }
  nav.nav a[aria-current=page] { color: var(--fg); font-weight: 600; background: color-mix(in srgb, var(--fg) 8%, transparent); }
  /* Royal Neon and Night City tint the active row with the accent instead. */
  [data-skin=royal] nav.nav a[aria-current=page], [data-skin=cyber] nav.nav a[aria-current=page] {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .side .grow { flex: 1; }
  /* The sign-in page's heading. */
  .brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px 12px; }
  .mark svg { width: 80px; height: 80px; color: var(--fg); opacity: .1; }
  .mark .slash { font-size: 11.5px; }
  .who { display: flex; align-items: center; gap: .6rem; margin: 0 16px; padding: .3rem 0 .6rem; font-size: 12.5px; }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--card-2); }
  .who .muted { font-size: 11.5px; }
  .sfind { display: flex; justify-content: space-between; align-items: baseline; margin: 0 16px; padding: 10px 4px 2px; box-shadow: inset 0 1px 0 var(--line); font-size: 12.5px; color: var(--muted); }
  .sfind:hover { color: var(--fg); }
  .sfind kbd { font: inherit; font-size: 11px; opacity: .7; }
  .side-foot { font-size: 11.5px; color: var(--faint); padding: .5rem 20px 0; font-variant-numeric: tabular-nums; }

  main#view { min-width: 0; padding: 0 0 7rem; }
  .page { max-width: 1240px; margin: 0 auto; padding: 2.5rem 2.5rem 0; animation: rise .32s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

  /* SumiPageHeader and SumiSectionHeader: 19pt and 15pt semibold, tight tracking. */
  h1 { font-size: 19px; font-weight: 600; letter-spacing: -.3px; margin: .2rem 0 1rem; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; margin: 0; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .error { color: var(--danger); }
  .okc { color: var(--ok); }
  .meta { font-size: 11.5px; color: var(--muted); }
  .dot::before { content: "\00b7"; margin: 0 .4rem; color: var(--faint); }

  .banner {
    display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .7rem 2.5rem; font-size: 13px;
    background: color-mix(in srgb, var(--accent) 9%, var(--bg)); box-shadow: inset 0 -1px 0 var(--line);
  }
  .banner code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; background: var(--card); padding: .25rem .5rem; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); overflow-x: auto; white-space: nowrap; max-width: 100%; }

  /* ---- hero ---- */
  .hero {
    position: relative; min-height: 400px; display: flex; align-items: flex-end; overflow: hidden;
    margin: 0 0 1.25rem; isolation: isolate;
  }
  .hero .art { position: absolute; inset: 0; z-index: -2; background: var(--card); }
  .hero .art img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: 0; transition: opacity .6s; }
  .hero .art img.in { opacity: 1; }
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 88%, transparent) 30%, color-mix(in srgb, var(--bg) 25%, transparent) 70%, transparent 100%),
      linear-gradient(0deg, var(--bg) 0%, transparent 45%);
  }
  .hero .copy { padding: 2.5rem 2.5rem 1.5rem; max-width: 640px; display: flex; flex-direction: column; gap: .7rem; }
  .hero .eyebrow { font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .hero h1 { font-size: 38px; line-height: 1.1; margin: 0; }
  .hero p.syn { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 60ch; }
  .hero .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .35rem; }
  .hero.skeleton .copy { opacity: 0; }

  /* ---- shelves ---- */
  .shelf { margin: 1.6rem 0 0; }
  .shelf-head { display: flex; align-items: baseline; gap: .8rem; margin-bottom: .75rem; }
  .shelf-head .sub { font-size: 12.5px; color: var(--muted); }
  .shelf-head .grow { flex: 1; }
  .shelf-head .arrows { display: flex; gap: .2rem; }
  .shelf-head .arrows button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: .2rem; border-radius: 6px; }
  .shelf-head .arrows button:hover { color: var(--fg); }
  .shelf-head .arrows svg { width: 18px; height: 18px; }
  .rail {
    display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 1rem; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; scrollbar-width: none; padding: 4px 4px 10px; margin: -4px -4px 0;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { scroll-snap-align: start; }
  .rail.wide { grid-auto-columns: 286px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.4rem 1rem; }

  .pc { display: flex; flex-direction: column; gap: .45rem; min-width: 0; }
  /* MediaCard: radius 10, a hairline that lifts to 25% foreground on hover,
     and no movement; the title rests at 80% and rises to full. The score is
     bare text in the meta row, not a chip on the art. */
  .pc .frame, .wc .frame, .ep .frame { position: relative; border-radius: var(--r-md); overflow: hidden; background: var(--card); }
  .pc .frame { display: block; aspect-ratio: 2 / 3; }
  .pc .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; corner-shape: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .2s;
  }
  .pc:hover .frame::after, .wc:hover .frame::after, .ep .frame:hover::after { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 25%, transparent); }
  .pc .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0, 0, 0, .45); }
  .pc .tick > i { display: block; height: 100%; background: var(--gauge); }
  .pc .name { font-size: 14px; font-weight: 600; line-height: 1.3; min-height: 2.6em; opacity: .8; transition: opacity .2s; }
  .pc:hover .name { opacity: 1; }
  .pc .name, .wc .name { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc .meta { margin-top: -.2rem; display: flex; gap: 6px; min-height: 14px; }

  .wc { display: flex; flex-direction: column; gap: .5rem; min-width: 0; cursor: pointer; }
  .wc .frame { aspect-ratio: 16 / 9; }
  .wc .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wc .frame .play {
    position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .18s;
    background: color-mix(in srgb, var(--bg) 35%, transparent);
  }
  .wc:hover .frame .play, .wc:focus-visible .frame .play { opacity: 1; }
  .play-dot { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; }
  .play-dot svg { width: 18px; height: 18px; margin-left: 2px; }
  .wc .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .wc .tick > i { display: block; height: 100%; background: var(--gauge); }
  .wc .line { display: flex; gap: .6rem; align-items: baseline; }
  .wc .line .name { flex: 1; -webkit-line-clamp: 1; }
  .wc .line .go { font-size: 12px; color: var(--accent); white-space: nowrap; }

  /* SumiEmptyState: a plain sentence where the content would be, semibold. */
  .empty { color: var(--fg); font-size: 13.5px; font-weight: 600; padding: 12px 0; margin: 0; }
  .skel { background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 12px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---- title page ---- */
  .backdrop { position: relative; height: 340px; overflow: hidden; margin-bottom: -210px; isolation: isolate; }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0; transition: opacity .6s; }
  .backdrop img.in { opacity: .55; }
  .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 8%, color-mix(in srgb, var(--bg) 40%, transparent) 70%, color-mix(in srgb, var(--bg) 20%, transparent)); }
  .tp { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 2.2rem; position: relative; }
  .tp .cover { width: 230px; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: 0 16px 44px var(--shade); }
  .tp .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tp h1 { font-size: 32px; line-height: 1.12; margin: 2.2rem 0 .3rem; }
  .tp .alt { color: var(--muted); font-size: 13px; margin-bottom: .55rem; }
  .tp .meta { font-size: 12.5px; display: flex; flex-wrap: wrap; row-gap: .2rem; }
  .tp .syn { max-width: 72ch; color: color-mix(in srgb, var(--fg) 84%, transparent); margin: .9rem 0 0; }
  .tp .syn.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: 1.2rem 0 0; }
  .actions .gap { flex: 0 0 .2rem; }
  .fav { background: none; border: 0; cursor: pointer; color: var(--muted); padding: .3rem; display: inline-flex; border-radius: 8px; }
  .fav svg { width: 20px; height: 20px; }
  .fav[aria-pressed=true] { color: var(--accent); }
  .fav[aria-pressed=true] svg path { fill: currentColor; }

  .tabs { display: flex; gap: 1.5rem; margin: 2.2rem 0 1.1rem; box-shadow: inset 0 -1px 0 var(--line); }
  .tabs button {
    background: none; border: 0; padding: .55rem 0; cursor: pointer; color: var(--muted); font-size: 14px; position: relative;
  }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected=true] { color: var(--fg); font-weight: 600; }
  .tabs button[aria-selected=true]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; }
  .tabs .count { color: var(--faint); font-weight: 400; margin-left: .3rem; font-size: 12px; }

  .groups { display: flex; flex-wrap: wrap; gap: .1rem .3rem; margin-bottom: 1rem; }
  .groups button { background: none; border: 0; cursor: pointer; color: var(--faint); padding: .2rem .4rem; font-size: 13px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .groups button:hover { color: var(--muted); }
  .groups button[aria-pressed=true] { color: var(--fg); font-weight: 600; background: var(--card); }

  .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.2rem 1rem; }
  .ep { display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
  .ep .frame { aspect-ratio: 16 / 9; cursor: pointer; border: 0; padding: 0; display: block; width: 100%; }
  .ep .frame:disabled { cursor: default; }
  .ep .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ep .frame .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ep .frame .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .18s; background: color-mix(in srgb, var(--bg) 35%, transparent); }
  .ep .frame:hover .play, .ep .frame:focus-visible .play { opacity: 1; }
  .ep .frame:disabled .play { display: none; }
  .ep .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .ep .tick > i { display: block; height: 100%; background: var(--gauge); }
  .ep.watched .frame img { opacity: .55; }
  .ep .hd { display: flex; gap: .5rem; align-items: baseline; font-size: 13px; }
  .ep .hd .n { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .ep .hd .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  .ep .ft { display: flex; gap: .2rem .75rem; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .ep .ft .grow { flex: 1; }
  .ep .ft .link, .ep .ft .lk { font-size: 12px; }
  .lk { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); }
  .lk:hover { color: var(--fg); }

  .timeline { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 1.2rem; overflow-x: auto; padding: 1.6rem 4px 12px; scrollbar-width: thin; }
  .timeline::before { content: ""; position: absolute; left: 0; right: 0; top: .5rem; height: 1px; background: var(--line); min-width: 100%; }
  .tl { position: relative; display: flex; flex-direction: column; gap: .4rem; }
  .tl::before { content: ""; position: absolute; top: -1.35rem; left: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 3px var(--bg); }
  .tl.here::before { background: var(--accent); }
  .tl.aside { opacity: .8; }
  .tl .when { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -.25rem; }
  .tl.here .frame { box-shadow: 0 0 0 2px var(--accent); }

  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: .8rem; }
  .person { display: flex; gap: .7rem; align-items: center; background: var(--card); border-radius: var(--r-xl); padding: .5rem; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
  .person img, .person .ph { width: 46px; height: 62px; border-radius: 8px; object-fit: cover; background: var(--card-2); flex: none; }
  .person .who2 { flex: 1; min-width: 0; font-size: 13px; }
  .person .who2 div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person.va { flex-direction: row; }
  .person .va-side { text-align: right; }

  .facts { display: grid; grid-template-columns: max-content 1fr; gap: .45rem 1.5rem; font-size: 13.5px; max-width: 720px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .8rem; margin-top: 1.4rem; }
  .gallery img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--card); display: block; }

  /* ---- search, library ---- */
  .searchbar { display: flex; align-items: center; gap: .6rem; background: var(--card); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); padding: .15rem .35rem .15rem .9rem; }
  .searchbar:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  .searchbar svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .searchbar input { flex: 1; min-width: 0; background: none; border: 0; padding: .75rem 0; font-size: 15px; box-shadow: none; }
  .searchbar kbd { font: 11px "Cascadia Mono", Consolas, monospace; color: var(--faint); padding: .15rem .4rem; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); margin-right: .4rem; }
  .filters { display: flex; flex-wrap: wrap; gap: .2rem 1.1rem; margin: .8rem 0 1.4rem; align-items: center; }
  .filters .clear { margin-left: auto; }
  .libbar { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; align-items: center; margin: 0 0 1.3rem; }
  .libbar .grow { flex: 1; }
  .libbar input.field { width: 220px; padding: .45rem .7rem; }
  .statuses { display: flex; flex-wrap: wrap; gap: .1rem 1.1rem; }
  .statuses button { background: none; border: 0; padding: .3rem 0; cursor: pointer; color: var(--muted); font-size: 14px; position: relative; }
  .statuses button:hover { color: var(--fg); }
  .statuses button[aria-pressed=true] { color: var(--fg); font-weight: 600; }
  .statuses button[aria-pressed=true]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--accent); border-radius: 2px; }
  .statuses .count { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: .25rem; }

  /* ---- schedule ---- */
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; margin-bottom: 1.4rem; }
  .days button {
    background: var(--card); border: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); padding: .6rem .5rem; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: .1rem; transition: background .15s;
  }
  .days button:hover { background: var(--card-2); }
  .days button .d { font-size: 12px; color: var(--muted); }
  .days button .n { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .days button .c { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .days button[aria-pressed=true] { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .days button[aria-pressed=true] .d { color: var(--accent); }
  .slots { display: flex; flex-direction: column; }
  .slot { display: grid; grid-template-columns: 84px 44px minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding: .6rem .4rem; border-radius: 10px; box-shadow: 0 1px 0 var(--line); }
  .slot:hover { background: var(--card); }
  .slot time { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .slot img, .slot .ph { width: 44px; height: 62px; border-radius: 7px; object-fit: cover; background: var(--card); }
  .slot .t { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .r { text-align: right; font-size: 12px; white-space: nowrap; }
  .slot.past { opacity: .6; }
  .slot.mine .t::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: .5rem; vertical-align: middle; }
  .nowline { display: flex; align-items: center; gap: .6rem; color: var(--accent); font-size: 11.5px; margin: .3rem 0; }
  .nowline::after { content: ""; flex: 1; height: 1px; background: var(--accent); opacity: .6; }

  /* ---- stats ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .8rem; margin-bottom: 1.8rem; }
  .tile { background: var(--card); border-radius: var(--r-xl); box-shadow: inset 0 0 0 1px var(--line); padding: 1rem 1.1rem; }
  .tile .v { font-size: 28px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 12.5px; color: var(--muted); }
  .panel { background: var(--card); border-radius: var(--r-xl); box-shadow: inset 0 0 0 1px var(--line); padding: 1.1rem 1.25rem; margin-bottom: 1.2rem; }
  .panel h2 { margin-bottom: .9rem; }
  .panel svg { display: block; max-width: 100%; }
  .two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1.2rem; }
  .toprow { display: grid; grid-template-columns: 22px 36px minmax(0, 1fr) auto; gap: .8rem; align-items: center; padding: .4rem 0; font-size: 13px; }
  .toprow img, .toprow .ph { width: 36px; height: 50px; border-radius: 6px; object-fit: cover; background: var(--card-2); }
  .toprow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toprow .bar { height: 3px; border-radius: 2px; background: var(--accent); margin-top: .3rem; }

  /* ---- settings ---- */
  .settings { max-width: 760px; }
  .set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .3rem 1.5rem; align-items: center; padding: 1rem 0; box-shadow: 0 1px 0 var(--line); }
  .set .k { font-weight: 600; }
  .set .h { grid-column: 1; font-size: 12.5px; color: var(--muted); }
  .set .c { grid-row: 1 / span 2; grid-column: 2; }
  .settings h2 { margin: 2rem 0 .2rem; }
  .skins { display: flex; gap: .8rem; flex-wrap: wrap; }
  .skin { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; gap: .35rem; align-items: center; font-size: 12px; color: var(--muted); }
  .skin i { display: block; width: 64px; height: 42px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); position: relative; overflow: hidden; }
  .skin i b { position: absolute; right: 8px; bottom: 8px; width: 14px; height: 14px; border-radius: 50%; }
  .skin[aria-pressed=true] { color: var(--fg); font-weight: 600; }
  .skin[aria-pressed=true] i { box-shadow: 0 0 0 2px var(--accent); }

  /* ---- overlays ---- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .modal { background: var(--card); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line), 0 24px 70px rgba(0, 0, 0, .5); width: min(720px, 100%); max-height: 86vh; display: flex; flex-direction: column; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  .modal header { padding: 1rem 1.25rem .8rem; display: flex; gap: 1rem; align-items: center; box-shadow: 0 1px 0 var(--line); }
  .modal header h3 { margin: 0; font-size: 15px; flex: 1; font-weight: 650; }
  .modal .body { padding: .6rem 1.25rem 1.1rem; overflow: auto; }
  .rels { display: flex; flex-direction: column; }
  .rel { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1.1rem; align-items: center; text-align: left; background: none; border: 0; cursor: pointer; padding: .65rem .5rem; border-radius: 10px; box-shadow: 0 1px 0 var(--line); }
  .rel:hover { background: var(--card-2); }
  .rel .nm { font-size: 13px; overflow-wrap: anywhere; }
  .rel .nm small { display: block; color: var(--accent); font-size: 11.5px; margin-top: .1rem; }
  .rel .sz, .rel .sd { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 64px; }
  .rel .sd.hi { color: var(--ok); }

  .resolving { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 1.25rem; align-items: center; padding: 1.1rem 1.25rem 1.25rem; }
  .resolving img, .resolving .ph { width: 96px; aspect-ratio: 2 / 3; border-radius: 10px; object-fit: cover; background: var(--card-2); }
  .steps { list-style: none; margin: .7rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; font-size: 13px; }
  .steps li { display: flex; gap: .55rem; align-items: center; color: var(--faint); }
  .steps li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--card-2); flex: none; }
  .steps li.done { color: var(--muted); }
  .steps li.done::before { background: var(--ok); }
  .steps li.on { color: var(--fg); }
  .steps li.on::before { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .resolving .detail { font-size: 12px; color: var(--muted); margin-top: .6rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

  .toasts { position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: .5rem; align-items: center; pointer-events: none; }
  .toast { background: var(--fg); color: var(--bg); border-radius: 10px; padding: .6rem 1rem; font-size: 13px; box-shadow: 0 10px 30px var(--shade); animation: rise .2s ease-out; max-width: min(520px, 90vw); pointer-events: auto; }
  .toast.error { background: var(--danger); color: #fff; }

  .np {
    position: fixed; left: 200px; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 1rem; align-items: center;
    background: var(--card); box-shadow: inset 0 1px 0 var(--line); padding: .6rem 2.5rem .7rem;
  }
  .np img, .np .ph { width: 44px; height: 62px; border-radius: 7px; object-fit: cover; background: var(--card-2); }
  .np .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .np .prog { height: 3px; border-radius: 2px; background: var(--card-2); margin-top: .45rem; overflow: hidden; }
  .np .prog > i { display: block; height: 100%; background: var(--accent); transition: width 1.9s linear; }

  .signin { max-width: 560px; margin: 4rem auto 0; display: flex; flex-direction: column; gap: 1rem; }
  .signin ol { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .4rem; color: var(--muted); }
  .signin ol a { color: var(--accent); }
  .signin .row { display: flex; gap: .6rem; flex-wrap: wrap; }

  [data-skin=cyber], [data-skin=dusk] {
    --hazard: repeating-linear-gradient(-45deg, var(--accent) 0 3.5px, rgba(0, 0, 0, .85) 3.5px 7.07px);
    --brackets:
      linear-gradient(var(--accent), var(--accent)) top left / 12px 1.5px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top left / 1.5px 12px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom right / 12px 1.5px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom right / 1.5px 12px no-repeat;
    --head: "Bahnschrift SemiCondensed", "Bahnschrift", "Avenir Next Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  }
  [data-skin=dusk] { --head: "Anicat Mincho", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Yu Mincho", serif; --cells: 24; }
  [data-skin=cyber] { --head: "Anicat Rajdhani", "Bahnschrift SemiCondensed", "Bahnschrift", "Arial Narrow", "Segoe UI", sans-serif; --cells: 12; }
  :is([data-skin=cyber], [data-skin=dusk]) :is(nav.nav a, .btn, input.field, textarea.field, .menu-btn, .frame, .toast, .rel, .slot, .skin i, .popover, .days button, .panel, .tile, .person, .searchbar, .tp .cover, .modal) { corner-shape: bevel; }
  [data-skin=cyber] nav.nav a { border-radius: 0 var(--r-sm) 0 var(--r-sm); }
  [data-skin=cyber] :is(.btn, input.field, textarea.field, .menu-btn, .frame, .toast, .rel, .slot, .skin i) { border-radius: 0 var(--r-md) 0 var(--r-md); }
  [data-skin=cyber] :is(.popover, .days button, .person.va) { border-radius: 0 var(--r-lg) 0 var(--r-lg); }
  [data-skin=cyber] :is(.panel, .tile, .person, .searchbar, .tp .cover) { border-radius: 0 var(--r-xl) 0 var(--r-xl); }
  [data-skin=cyber] .modal { border-radius: 0 16px 0 16px; }

  /* Cards and posters: brackets on Night City, a second frame inset 3px at 40%
     accent on Evangelion, and the hovered poster's accent outline on both. */
  :is([data-skin=cyber], [data-skin=dusk]) :is(.panel, .tile, .person) { position: relative; }
  :is([data-skin=cyber], [data-skin=dusk]) :is(.panel, .tile, .person)::before,
  [data-skin=dusk] .frame::before { content: ""; position: absolute; pointer-events: none; }
  [data-skin=cyber] :is(.panel, .tile, .person)::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; corner-shape: inherit; }
  [data-skin=cyber] :is(.panel, .tile, .person, .frame)::after { background: var(--brackets); }
  [data-skin=dusk] :is(.panel, .tile, .person)::before, [data-skin=dusk] .frame::before {
    inset: 3px; border-radius: calc(var(--r-md) - 3px); corner-shape: bevel; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  [data-skin=dusk] :is(.panel, .tile, .person)::before { border-radius: calc(var(--r-xl) - 3px); }
  [data-skin=cyber] .pc:hover .frame { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent); }
  :is([data-skin=cyber], [data-skin=dusk]) .pc:hover .frame::after { box-shadow: inset 0 0 0 1px var(--accent); }
  [data-skin=cyber] nav.nav a[aria-current=page] { box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); }

  /* Headings: condensed bold on Night City, heavy serif on Evangelion; page and
     section titles upper case. Page titles carry a 36x2 accent underline (Night
     City) or a 44x5 hazard bar; section titles are objective lines, a pip, the
     title in the accent and a hairline running out to the count. */
  :is([data-skin=cyber], [data-skin=dusk]) :is(h1, h2, h3, .t-name) { font-family: var(--head); font-weight: 700; }
  [data-skin=dusk] :is(h1, h2, h3, .t-name) { font-weight: 800; }

  /* The rail: a solid card at 90% so the page picture shows through, a brand

  .hudbrand { display: none; }

  [data-skin=dusk] aside.side { box-shadow: none; }

  :is([data-skin=cyber], [data-skin=dusk]) nav.nav .grp { display: flex; align-items: center; gap: 8px; font: 700 11px/1.4 var(--head); letter-spacing: 1.2px; text-transform: uppercase; }
  :is([data-skin=cyber], [data-skin=dusk]) nav.nav .grp::before { content: ""; width: 5px; height: 5px; background: var(--accent); }
  :is([data-skin=cyber], [data-skin=dusk]) nav.nav .grp::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  :is([data-skin=cyber], [data-skin=dusk]) nav.nav a { font: 700 14px/1.3 var(--head); letter-spacing: .6px; text-transform: uppercase; }
  :is([data-skin=cyber], [data-skin=dusk]) nav.nav a::before { content: ""; flex: none; width: 5px; height: 5px; margin: 0 10.5px 0 2.5px; background: var(--line); }
  :is([data-skin=cyber], [data-skin=dusk]) nav.nav a[aria-current=page] { color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
  [data-skin=cyber] nav.nav a[aria-current=page] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent), 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); }
  :is([data-skin=cyber], [data-skin=dusk]) nav.nav a[aria-current=page]::before { background: var(--accent); }
  [data-skin=dusk] nav.nav a[aria-current=page]::before { width: 10px; height: 10px; margin: 0 8px 0 0; background: var(--hazard); }
  :is([data-skin=cyber], [data-skin=dusk]) .sfind kbd { color: var(--accent); padding: 2px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent); opacity: 1; }

  /* Evangelion's warning banner: hazard stripes along its top and bottom edge. */
  [data-skin=dusk] .banner { position: relative; padding-block: 1rem; }
  [data-skin=dusk] .banner::before, [data-skin=dusk] .banner::after { content: ""; position: absolute; left: 0; right: 0; height: 5px; background: var(--hazard); }
  [data-skin=dusk] .banner::before { top: 0; }
  [data-skin=dusk] .banner::after { bottom: 0; }

  /* The page ground: the skin's own picture when <data dir>/skin-art/<skin>/background
     exists, at 30% and faded into the ground toward the bottom so text keeps its
     contrast. A missing file is a 404 and the ground stays plain. */
  [data-skin=ink] { --art: url(/api/skin-art/ink/background); }
  [data-skin=sakura] { --art: url(/api/skin-art/sakura/background); }

  body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; }
