async function viewTitle(host, token, catalog, id, tabArg) {
  if (!["anilist", "tmdb_movie", "tmdb_tv"].includes(catalog) || !/^\d+$/.test(id)) {
    page(host).append(el("p", { class: "error", text: "Unknown title address." }));
    return;
  }
  const catalogId = Number(id);
  const backdrop = el("div", { class: "backdrop" });
  host.append(backdrop);
  const p = page(host);
  p.style.paddingTop = "0";
  const loading = el("div", { class: "tp" }, el("div", { class: "cover skel" }), el("div", {}, el("div", { class: "skel", style: "height:34px;width:60%;margin-top:2.2rem" })));
  p.append(loading);
  let d;
  try {
    d = await fetchDetail(catalog, catalogId, true);
  } catch (e) {
    loading.replaceWith(el("p", { class: "error", text: errorText(e), style: "margin-top:4rem" }));
    return;
  }
  if (token !== state.renderToken) return;
  document.title = `${d.title} - Anicat`;
  const title = d.title;
  const cover = d.cover_image;
  const episodes = d.episodes || [];
  const extrasP = isCinema(catalog) ? api("GET", `/api/cinema/${catalogId}/extras?catalog=${catalog}`).catch(() => null) : Promise.resolve(null);
  if (d.banner_image) backdrop.append(img(d.banner_image, { loading: "eager" }));
  else extrasP.then((x) => { if (x && x.gallery && x.gallery[0]) backdrop.append(img(x.gallery[0], { loading: "eager" })); });

  const meta = [formatLabel(d.format), d.year, d.status ? humanize(d.status) : null, d.studio,
    d.average_score ? `${d.average_score}%` : null,
    d.episode_count && catalog !== "tmdb_movie" ? `${d.episode_count} episodes` : null,
    d.duration_minutes ? `${d.duration_minutes} min` : null].filter(Boolean);

  const actions = el("div", { class: "actions" });
  const syn = el("p", { class: "syn clamp" }, sanitizedSynopsis(d.synopsis));
  const more = el("button", { type: "button", class: "lk", text: "More", style: "margin-top:.3rem", onclick: () => {
    syn.classList.toggle("clamp");
    more.textContent = syn.classList.contains("clamp") ? "More" : "Less";
  } });
  const info = el("div", { style: "min-width:0" },
    el("h1", { class: "t-name" }, title),
    d.romaji_title && d.romaji_title !== title ? el("div", { class: "alt" }, d.romaji_title) : null,
    el("div", { class: "meta" }, meta.map((m, i) => el("span", { class: i ? "dot" : null }, m))),
    d.genres && d.genres.length ? el("div", { class: "meta", style: "margin-top:.25rem" }, d.genres.join(", ")) : null,
    syn, more, actions);
  const header = el("div", { class: "tp" }, el("div", { class: "cover" }, img(cover, { loading: "eager" })), info);
  // Re-rendered after a change so the page's own buttons and ticks agree.
  attachMenu(header, () => titleMenuItems(catalog, catalogId, d, { here: true, noPlay: true, status: () => render(), removed: () => render() }));
  loading.replaceWith(header);
  requestAnimationFrame(() => { if (syn.scrollHeight <= syn.clientHeight + 2) more.remove(); });

  // Primary action: resume, next, or the first aired episode.
  const playOpts = (episode, extra) => Object.assign({ catalog, catalogId, episode, title, cover }, extra || {});
  if (catalog === "tmdb_movie") {
    const film = episodes[0];
    const resume = d.resume_episode === 1 && d.resume_seconds > 0 ? d.resume_seconds : 0;
    actions.append(
      el("button", { type: "button", class: "btn primary", onclick: () => play(playOpts(1)) }, icon("play"), resume ? `Resume at ${clock(resume)}` : "Play"),
      resume ? el("button", { type: "button", class: "btn", text: "From the start", onclick: () => play(playOpts(1, { fromStart: true })) }) : null,
      el("button", { type: "button", class: "btn", text: "Releases", onclick: () => openReleases(playOpts(1)) }),
      film && !film.is_watched ? el("button", { type: "button", class: "btn", text: "Mark watched", onclick: () => markWatched(catalog, catalogId, 1) }) : null,
    );
  } else {
    const resumeRow = d.resume_episode ? episodes.find((e) => e.number === d.resume_episode) : null;
    const listNext = d.list_progress ? episodes.find((e) => e.number === d.list_progress + 1) : null;
    const firstAired = episodes.find((e) => e.is_aired);
    if (resumeRow && resumeRow.is_aired) {
      actions.append(el("button", { type: "button", class: "btn primary", onclick: () => play(playOpts(resumeRow.number)) }, icon("play"),
        d.resume_seconds > 0 ? `Resume episode ${resumeRow.number} at ${clock(d.resume_seconds)}` : `Play episode ${resumeRow.number}`));
    } else if (listNext && listNext.is_aired) {
      actions.append(el("button", { type: "button", class: "btn primary", onclick: () => play(playOpts(listNext.number)) }, icon("play"), `Play episode ${listNext.number}`));
    } else if (firstAired) {
      actions.append(el("button", { type: "button", class: "btn primary", onclick: () => play(playOpts(firstAired.number)) }, icon("play"), `Play episode ${firstAired.number}`));
    }
  }

  if (catalog === "anilist") {
    // Sub/Dub is a per-title preference sent with every play and release
    // search; the audio language is recorded too so the player picks the
    // matching track inside a dual-audio release.
    actions.append(slash([[false, "Sub"], [true, "Dub"]], preferDub(catalog, catalogId), (on) => {
      store.set(`anicat_dub_${catalog}_${catalogId}`, on ? "1" : "0");
    }, "Audio"));
    if (state.signedIn) {
      const statusMenu = menu({ label: "List", value: d.list_status || "",
        options: [["", "Not on list"], ...ANIME_STATUSES.map((s) => [s, STATUS_LABELS[s]])],
        onChange: async (v) => {
          try {
            if (!v) {
              if (!d.list_entry_id || !confirm(`Remove "${title}" from your AniList list?`)) { statusMenu.set(d.list_status || ""); return; }
              await api("DELETE", `/api/list/${d.list_entry_id}`);
              d.list_status = null; d.list_entry_id = null;
              toast("Removed from your list.");
            } else {
              await api("POST", "/api/list-entry", { catalog_id: catalogId, status: v });
              d.list_status = v;
              toast(`Saved as ${STATUS_LABELS[v]}.`);
            }
            listMemo.clear();
            detailMemo.delete(`${catalog}:${catalogId}`);
          } catch (e) { statusMenu.set(d.list_status || ""); toast(errorText(e), true); }
        } });
      let fav = !!d.is_favourite;
      const favBtn = el("button", { type: "button", class: "fav", "aria-pressed": String(fav), "aria-label": "Favourite", title: "Favourite",
        onclick: async () => {
          favBtn.disabled = true;
          try {
            const r = await api("POST", "/api/favourite", { catalog_id: catalogId, currently_favourite: fav });
            fav = !!r.is_favourite;
            favBtn.setAttribute("aria-pressed", String(fav));
            detailMemo.delete(`${catalog}:${catalogId}`);
          } catch (e) { toast(errorText(e), true); }
          favBtn.disabled = false;
        } }, icon("heart"));
      actions.append(statusMenu, favBtn);
    }
  } else {
    const select = menu({ label: "List", value: "", options: [["", "Not on list"], ...CINEMA_STATUSES.map((s) => [s, STATUS_LABELS[s]])],
      onChange: async (v) => {
        try {
          await api("POST", "/api/cinema/list", { catalog, catalog_id: catalogId, status: v || null });
          toast(v ? `Saved as ${STATUS_LABELS[v]}.` : "Removed from your list.");
        } catch (e) { toast(errorText(e), true); }
      } });
    actions.append(select);
    api("GET", "/api/cinema/list").then((rows) => {
      const hit = rows.find((r) => r.catalog === catalog && r.catalog_id === catalogId);
      select.set(hit ? hit.status : "");
    }, () => {});
  }

  // Tabs. Each one draws on first open; the address remembers which is open.
  const tabDefs = [];
  if (catalog !== "tmdb_movie") tabDefs.push(["episodes", "Episodes", episodes.length || null, (h) => drawEpisodes(h, { d, catalog, catalogId, episodes, token, extrasP })]);
  if (catalog === "anilist") {
    tabDefs.push(["timeline", "Timeline", null, (h) => drawTimeline(h, catalogId)]);
    tabDefs.push(["characters", "Characters", null, (h) => drawCharacters(h, api("GET", `/api/characters/${catalogId}`))]);
    const related = (d.relations || []).length + (d.recommendations || []).length;
    if (related) tabDefs.push(["related", "Related", null, (h) => drawRelated(h, d)]);
  } else {
    tabDefs.push(["cast", "Cast", null, (h) => drawCharacters(h, api("GET", `/api/cinema/${catalogId}/cast?catalog=${catalog}`))]);
    tabDefs.push(["details", "Details", null, (h) => drawCinemaFacts(h, extrasP)]);
  }
  const tabBar = el("div", { class: "tabs", role: "tablist" });
  const panes = new Map();
  const tabHost = el("div", {});
  p.append(tabBar, tabHost);
  const openTab = (key) => {
    for (const b of tabBar.children) b.setAttribute("aria-selected", String(b.dataset.key === key));
    for (const [k, pane] of panes) pane.hidden = k !== key;
    if (!panes.has(key)) {
      const pane = el("div", { role: "tabpanel" });
      panes.set(key, pane);
      tabHost.append(pane);
      tabDefs.find((t) => t[0] === key)[3](pane);
    }
    history.replaceState(null, "", `#/title/${catalog}/${catalogId}/${key}`);
  };
  for (const [key, label, count] of tabDefs) {
    tabBar.append(el("button", { type: "button", role: "tab", "data-key": key, onclick: () => openTab(key) },
      label, count ? el("span", { class: "count num" }, count) : null));
  }
  openTab(tabDefs.some((t) => t[0] === tabArg) ? tabArg : tabDefs[0][0]);
}

function drawEpisodes(host, { d, catalog, catalogId, episodes, token, extrasP }) {
  if (!episodes.length) { host.append(el("p", { class: "empty", text: "No episodes listed yet." })); return; }
  const title = d.title;
  const cover = d.cover_image;
  const groupBar = el("div", { class: "groups" });
  const gridHost = el("div", { class: "eps" });
  host.append(groupBar, gridHost);

  // Groups: a series' seasons from TMDB's season map (the engine numbers
  // episodes straight through), otherwise blocks of 50 for long runs.
  let groups = [{ label: null, from: episodes[0].number, to: episodes[episodes.length - 1].number }];
  const target = d.resume_episode || (d.list_progress ? d.list_progress + 1 : episodes[0].number);
  const drawGroups = (active) => {
    if (groups.length < 2) { groupBar.hidden = true; return; }
    groupBar.hidden = false;
    groupBar.replaceChildren(...groups.map((g, i) => el("button", { type: "button", "aria-pressed": String(i === active),
      onclick: () => { drawGroups(i); drawGrid(g); } }, g.label)));
  };
  const openAt = () => {
    const i = Math.max(0, groups.findIndex((g) => target >= g.from && target <= g.to));
    drawGroups(i);
    drawGrid(groups[i]);
  };

  const drawGrid = (g) => {
    const rows = episodes.filter((e) => e.number >= g.from && e.number <= g.to);
    const offset = g.offset || 0;
    gridHost.replaceChildren(...rows.map((ep) => {
      const shown = ep.number - offset;
      const frac = !ep.is_watched && ep.progress_percent > 0 ? Math.min(100, ep.progress_percent) : 0;
      const pos = el("span", {});
      const cell = el("div", { class: "ep" + (ep.is_watched ? " watched" : "") },
        el("button", { type: "button", class: "frame", disabled: !ep.is_aired, "aria-label": `Play episode ${ep.number}`,
          onclick: () => play({ catalog, catalogId, episode: ep.number, title, cover }) },
          ep.thumbnail ? img(ep.thumbnail) : el("span", { class: "ph" }, shown),
          el("span", { class: "play" }, el("span", { class: "play-dot" }, icon("play"))),
          frac ? el("span", { class: "tick" }, el("i", { style: `width:${frac.toFixed(1)}%` })) : null),
        el("div", { class: "hd", title: ep.title },
          el("span", { class: "n" }, g.offset !== undefined ? `E${shown}` : shown),
          el("span", { class: "t" }, ep.title && !/^Episode \d+$/.test(ep.title) ? ep.title : `Episode ${shown}`)),
        el("div", { class: "ft" },
          ep.is_watched ? el("span", { class: "okc" }, "Watched") : null,
          !ep.is_aired ? el("span", {}, ep.air_date ? `Airs ${ep.air_date}` : "Not aired") : null,
          ep.is_aired && ep.runtime_minutes ? el("span", {}, `${ep.runtime_minutes} min`) : null,
          pos,
          el("span", { class: "grow" }),
          ep.is_aired ? el("button", { type: "button", class: "lk", text: "Releases", onclick: () => openReleases({ catalog, catalogId, episode: ep.number, title, cover }) }) : null,
          ep.is_aired && !ep.is_watched ? el("button", { type: "button", class: "lk", text: "Mark watched", onclick: () => markWatched(catalog, catalogId, ep.number) }) : null),
      );
      const epOpts = { catalog, catalogId, episode: ep.number, title, cover };
      attachMenu(cell, () => [
        ep.is_aired ? { label: `Play episode ${shown}`, run: () => play(epOpts) } : null,
        ep.is_aired && frac ? { label: "Play from the start", run: () => play(Object.assign({ fromStart: true }, epOpts)) } : null,
        ep.is_aired ? { label: "Choose a release", run: () => openReleases(epOpts) } : null,
        "-",
        ep.is_watched || frac ? { label: ep.is_watched ? "Mark unwatched" : "Clear progress", run: () => markUnwatched(catalog, catalogId, ep.number, d) } : null,
        ep.is_aired && !ep.is_watched ? { label: "Mark watched", run: () => markWatched(catalog, catalogId, ep.number) } : null,
        ep.is_aired ? null : { heading: ep.air_date ? `Airs ${ep.air_date}` : "Not aired yet" },
      ]);
      if (frac) {
        api("GET", `/api/progress/${catalogId}?episode=${ep.number}&catalog=${catalog}`).then((pr) => {
          if (pr && pr.stop_time > 0 && token === state.renderToken) pos.textContent = `Stopped at ${clock(pr.stop_time)}`;
        }, () => {});
      }
      return cell;
    }));
  };

  if (catalog === "tmdb_tv") {
    extrasP.then((x) => {
      const seasons = (x && x.seasons) || [];
      if (seasons.length > 1) {
        let at = 0;
        groups = seasons.map((s) => {
          const g = { label: `Season ${s.number}`, from: at + 1, to: at + s.episode_count, offset: at };
          at += s.episode_count;
          return g;
        });
      }
      if (token === state.renderToken) openAt();
    });
    return;
  }
  if (episodes.length > GROUP_SIZE + 10) {
    groups = [];
    for (let i = 0; i < episodes.length; i += GROUP_SIZE) {
      const from = episodes[i].number;
      const to = episodes[Math.min(i + GROUP_SIZE, episodes.length) - 1].number;
      groups.push({ label: `${from}-${to}`, from, to });
    }
  }
  openAt();
}

async function drawTimeline(host, catalogId) {
  host.append(el("p", { class: "muted", text: "Walking the franchise..." }));
  let entries;
  try { entries = await api("GET", `/api/franchise/${catalogId}`); } catch (e) {
    host.replaceChildren(el("p", { class: "error", text: errorText(e) }));
    return;
  }
  if (!entries.length || (entries.length === 1 && entries[0].catalog_id === catalogId)) {
    host.replaceChildren(el("p", { class: "empty", text: "This title stands alone." }));
    return;
  }
  const line = el("div", { class: "timeline" }, entries.map((e) => {
    const when = [e.season ? humanize(e.season) : null, e.year].filter(Boolean).join(" ");
    const bits = [formatLabel(e.format), e.episodes ? `${e.episodes} ep` : null, e.aside ? humanize(e.aside) : null].filter(Boolean);
    const node = el("div", { class: "tl pc" + (e.catalog_id === catalogId ? " here" : "") + (e.aside ? " aside" : "") },
      el("div", { class: "when" }, when || "Date unknown"),
      el("a", { class: "frame", href: titleHref("anilist", e.catalog_id), "aria-label": e.title }, img(e.cover_image)),
      el("a", { class: "name t-name", href: titleHref("anilist", e.catalog_id) }, e.title),
      el("div", { class: "meta" }, bits.join(" · "),
        e.list_status ? el("div", { style: "color:var(--accent)" }, STATUS_LABELS[e.list_status] || humanize(e.list_status)) : null));
    attachMenu(node, () => titleMenuItems("anilist", e.catalog_id, e));
    return node;
  }));
  host.replaceChildren(el("p", { class: "meta", style: "margin:0 0 .4rem" }, `${entries.length} entries in watch order. Side stories are dimmed.`), line);
  const here = line.querySelector(".here");
  if (here) requestAnimationFrame(() => { line.scrollLeft = Math.max(0, here.offsetLeft - line.clientWidth / 3); });
}

async function drawCharacters(host, request) {
  host.append(el("p", { class: "muted", text: "Loading..." }));
  let rows;
  try { rows = await request; } catch (e) { host.replaceChildren(el("p", { class: "error", text: errorText(e) })); return; }
  if (!rows.length) { host.replaceChildren(el("p", { class: "empty", text: "No one listed." })); return; }

  const rows = s.top_titles.slice(0, 8);
  const maxSec = Math.max(1, ...rows.map((r) => r.seconds));

  if (token !== state.renderToken) return;
  top.append(...rows.map((r, i) => {
    const d = details[i] && !details[i].error ? details[i] : null;

  }));

function tile(v, k) { return el("div", { class: "tile" }, el("div", { class: "v" }, v), el("div", { class: "k" }, k)); }

const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...kids) {
  const n = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  for (const c of kids) if (c) n.append(c);
  return n;
}

function heatmap(days) {
  const cell = 13, gap = 3;
  const first = days.length ? new Date(days[0].date + "T00:00:00") : new Date();
  const lead = (first.getDay() + 6) % 7; // weeks start on Monday
  const weeks = Math.ceil((days.length + lead) / 7);
  const max = Math.max(1, ...days.map((d) => d.seconds));
  const root = svg("svg", { viewBox: `0 0 ${weeks * (cell + gap) + 30} ${7 * (cell + gap) + 18}`, width: weeks * (cell + gap) + 30, role: "img", "aria-label": "Watch time per day" });
  ["Mon", "", "Wed", "", "Fri", "", ""].forEach((t, i) => {
    if (t) root.append(svg("text", { x: 0, y: 18 + i * (cell + gap) + 10, "font-size": 9, fill: "var(--faint)" }, document.createTextNode(t)));
  });
  let lastMonth = -1;
  days.forEach((d, i) => {
    const k = i + lead;
    const x = 30 + Math.floor(k / 7) * (cell + gap);
    const y = 18 + (k % 7) * (cell + gap);
    const date = new Date(d.date + "T00:00:00");
    if (k % 7 === 0 || i === 0) {
      if (date.getMonth() !== lastMonth && date.getDate() <= 7) {
        lastMonth = date.getMonth();
        root.append(svg("text", { x, y: 10, "font-size": 9, fill: "var(--muted)" }, document.createTextNode(date.toLocaleDateString([], { month: "short" }))));
      }
    }
    const t = d.seconds / max;
    const r = svg("rect", { x, y, width: cell, height: cell, rx: 3,
      fill: d.seconds ? `color-mix(in srgb, var(--accent) ${Math.round(22 + t * 78)}%, var(--card-2))` : "var(--card-2)" });
    r.append(svg("title", {}, document.createTextNode(`${date.toLocaleDateString()}: ${d.seconds ? hours(d.seconds) : "nothing"}${d.episodes ? `, ${d.episodes} episodes` : ""}`)));
    root.append(r);
  });
  return el("div", { style: "overflow-x:auto" }, root);
}

function hourChart(byHour) {
  const w = 14, gap = 4, h = 90;
  const max = Math.max(1, ...byHour);
  const root = svg("svg", { viewBox: `0 0 ${24 * (w + gap)} ${h + 16}`, width: "100%", role: "img", "aria-label": "Episodes started per hour" });
  byHour.forEach((n, i) => {
    const bh = Math.max(2, (n / max) * h);
    const r = svg("rect", { x: i * (w + gap), y: h - bh, width: w, height: bh, rx: 3, fill: n === max ? "var(--accent)" : "color-mix(in srgb, var(--accent) 45%, var(--card-2))" });
    r.append(svg("title", {}, document.createTextNode(`${String(i).padStart(2, "0")}:00, ${n} started`)));
    root.append(r);
    if (i % 6 === 0) root.append(svg("text", { x: i * (w + gap), y: h + 13, "font-size": 9, fill: "var(--faint)" }, document.createTextNode(`${String(i).padStart(2, "0")}:00`)));
  });
  return root;
}

async function viewSignIn(host) {
  const input = el("input", { class: "field", type: "text", placeholder: "Paste the token or the whole address", "aria-label": "AniList token", autocomplete: "off", spellcheck: "false" });
  const status = el("p", { class: "muted", style: "margin:0" });
  const submit = el("button", { type: "submit", class: "btn primary", text: "Sign in" });
  const form = el("form", {
    class: "signin",
    onsubmit: async (ev) => {
      ev.preventDefault();
      const token = extractToken(input.value);
      if (!token) { status.className = "error"; status.textContent = "That does not contain a token."; return; }
      submit.disabled = true;
      status.className = "muted";
      status.textContent = "Checking with AniList...";
      try {
        const r = await api("POST", "/api/token", { token });
        state.signedIn = !!r.signed_in;
        state.profile = r.profile || null;
        state.viewerError = null;
        store.del("anicat_skip_signin");
        drawWho();
        location.hash = "#/";
      } catch (e) {
        status.className = "error";
        status.textContent = e instanceof ApiFailure && e.anilistDown ? errorText(e) : `AniList refused the token: ${errorText(e)}`;
      } finally {
        submit.disabled = false;
      }
    },
  },
    el("div", { class: "brand", style: "padding:0;font-size:22px" }, icon("paw"), "Anicat"),
    el("h1", { style: "margin:0" }, "Sign in to AniList"),
    el("p", { class: "muted", style: "margin:0" }, "Your anime list and progress sync with your AniList account. Films and TV work without one."),
    el("ol", {},
      el("li", {}, el("a", { href: SIGNIN_URL, target: "_blank", rel: "noopener noreferrer" }, "Open AniList sign-in"), " and approve Anicat."),
      el("li", {}, "AniList shows a page whose address contains access_token=. Copy the token, or the whole address, and paste it here."),
    ),
    input,
    el("div", { class: "row" },
      submit,
      el("button", { type: "button", class: "btn", text: "Skip, Films and TV only", onclick: () => {
        store.set("anicat_skip_signin", "1");
        setMode("cinema", true);
        location.hash = "#/";
      } }),
    ),
    status,
  );
  page(host).append(form);
  input.focus();
}

function extractToken(raw) {
  const text = (raw || "").trim();
  if (!text) return null;
  const m = text.match(/access_token=([^&\s#]+)/);
  if (m) return decodeURIComponent(m[1]);
  // A bare token has no spaces and no URL punctuation.
  if (/^[A-Za-z0-9._\-]+$/.test(text)) return text;
  return null;
}

function setRow(key, hint, control) {
  return el("div", { class: "set" }, el("div", { class: "k" }, key), el("div", { class: "c" }, control), el("div", { class: "h" }, hint));
}

// ---- theme ------------------------------------------------------------------

const systemLight = matchMedia("(prefers-color-scheme: light)");
function applyTheme() {
  const skin = store.get("anicat_skin") || "ink";
  const follow = store.get("anicat_follow_system") !== "0";
  let theme = follow ? (systemLight.matches ? "light" : "dark") : (store.get("anicat_theme") || "dark");
  if (!hasLight(skin)) theme = "dark";
  document.documentElement.dataset.skin = skin;
  document.documentElement.dataset.theme = theme;
}
systemLight.addEventListener("change", applyTheme);

// ---- router -----------------------------------------------------------------

function setMode(mode, keepRoute) {
  state.mode = mode;
  store.set("anicat_mode", mode);
  for (const b of document.querySelectorAll("[data-mode]")) {
    b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  }
  for (const a of document.querySelectorAll("[data-anime-only]")) a.hidden = mode !== "anime";
  // The Mac rail calls the anime home "Anime" and the cinema one "Home".
  document.querySelector("[data-tab=home] span").textContent = mode === "anime" ? "Anime" : "Home";
  if (!keepRoute) {
    const tab = currentRoute().tab;
    // A title page belongs to one catalog, and the schedule is anime's alone;
    // switching from either lands on that mode's home.
    if (tab === "title" || (tab === "schedule" && mode !== "anime")) location.hash = "#/";
    else render();
  }
}

function currentRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const tab = parts[0] || "home";
  return { tab, parts };
}

async function render() {
  const token = ++state.renderToken;
  closePopover();
  const { tab, parts } = currentRoute();
  // A bookmark to a cinema title opened while the switch is on Anime (or the
  // reverse) follows the title rather than showing it under the wrong tabs.
  if (tab === "title" && ["anilist", "tmdb_movie", "tmdb_tv"].includes(parts[1])) {
    const wantMode = isCinema(parts[1]) ? "cinema" : "anime";
    if (state.mode !== wantMode) setMode(wantMode, true);
  }
  const host = document.getElementById("view");
  host.replaceChildren();
  window.scrollTo(0, 0);
  document.title = "Anicat";
  for (const a of document.querySelectorAll("nav.nav a")) {
    const active = a.dataset.tab === tab;
    if (active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }

  try {
    switch (tab) {
      case "home": await viewHome(host, token); break;
      case "schedule": await viewSchedule(host, token); break;
      case "library": await viewLibrary(host, token, parts[1]); break;
      case "search": await viewSearch(host, token, parts[1] ? decodeURIComponent(parts[1]) : ""); break;
      case "title": await viewTitle(host, token, parts[1], parts[2], parts[3]); break;
      case "stats": await viewStats(host, token); break;
      case "settings": await viewSettings(host, token); break;
      case "signin": await viewSignIn(host, token); break;
      default: page(host).append(el("p", { class: "error", text: "Page not found." }), el("a", { class: "link", href: "#/" }, "Go home"));
    }
  } catch (e) {
    if (token === state.renderToken) page(host).append(el("p", { class: "error", text: errorText(e) }));
  }
}

function drawWho() {
  const who = document.getElementById("who");
  if (state.signedIn && state.profile) {
    who.replaceChildren(img(state.profile.avatar_url, { loading: "eager" }),
      el("div", { style: "min-width:0" }, el("div", {}, state.profile.name), el("div", { class: "muted" }, "AniList")));
  } else if (state.signedIn) {
    who.replaceChildren(el("div", { class: "muted" }, state.viewerError ? "AniList unreachable" : "Signed in"));
  } else {
    who.replaceChildren(el("div", {}, el("div", {}, "Not signed in"), el("div", { class: "muted" }, "Sign in to AniList")));
    who.setAttribute("href", "#/signin");
    return;
  }
  who.setAttribute("href", "#/settings");
}

// ---- keyboard ---------------------------------------------------------------

// The page is an app: the browser's own menu (Back, Save as, Inspect) over a
// poster or the page background is noise. Text boxes and selected text keep
// it for copy and paste, and Shift+right-click reaches it anywhere.
document.addEventListener("contextmenu", (e) => {
  if (e.shiftKey) return;
  if (e.target.closest && e.target.closest("input, textarea, [contenteditable]")) return;
  if (String(getSelection() || "").trim()) return;
  e.preventDefault();
});

let pendingG = 0;
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) {
    if (e.key === "Escape") t.blur();
    return;
  }
  if (document.querySelector(".overlay")) return;
  if (e.key === "/") {
    e.preventDefault();
    const box = document.querySelector(".searchbar input");
    if (box) box.focus(); else location.hash = "#/search";
    return;
  }
  const now = Date.now();
  if (e.key === "g") { pendingG = now; return; }
  if (now - pendingG < 900) {
    const to = { h: "#/", s: "#/schedule", l: "#/library", t: "#/stats" }[e.key];
    pendingG = 0;
    if (to) { e.preventDefault(); location.hash = to; }
  }
});

// ---- version banner ---------------------------------------------------------

// The installer stops this server to replace it and opens the new one, so
// the page loses its connection on success; only a refusal is shown.
function updateNowButton() {
  const btn = el("button", { type: "button", class: "btn", text: "Update now", onclick: async () => {
    btn.disabled = true;
    btn.textContent = "Updating...";
    try {
      await api("POST", "/api/update");
      toast("Updating. Anicat restarts in a moment; reload this page after.");
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Update now";
      toast(errorText(e), true);
    }
  } });
  return btn;
}

async function checkVersion() {
  let v;
  try { v = await api("GET", "/api/version"); } catch { return; }
  if (!v) return;
  document.getElementById("side-foot").textContent = v.current ? `Version ${v.current}` : "";
  if (!v.update_available || !v.latest) return;
  if (store.get("anicat_update_dismissed") === v.latest) return;
  const banner = document.getElementById("update-banner");
  const copyHost = el("div", { style: "flex-basis:100%" });
  banner.replaceChildren(...[
    el("span", {}, v.can_install
      ? `Anicat ${v.latest} is out.`
      : `Anicat ${v.latest} is out. Run the install command again to update.`),
    v.can_install ? updateNowButton() : el("code", {}, INSTALL_COMMAND),
    el("button", { type: "button", class: "btn", text: "Copy install command", onclick: async () => {
      if (await copyText(INSTALL_COMMAND, copyHost)) toast("Install command copied.");
    } }),
    v.page_url ? el("a", { class: "link", href: v.page_url, target: "_blank", rel: "noopener noreferrer" }, "Release notes") : null,
    el("span", { style: "flex:1" }),
    el("button", { type: "button", class: "btn ghost", text: "Dismiss", onclick: () => {
      store.set("anicat_update_dismissed", v.latest);
      banner.hidden = true;
    } }),
    copyHost,
  ].filter(Boolean));
  banner.hidden = false;
}

// ---- boot -------------------------------------------------------------------

async function boot() {
  for (const n of document.querySelectorAll("[data-icon]")) n.replaceWith(icon(n.dataset.icon));
  for (const b of document.querySelectorAll("[data-mode]")) {
    b.addEventListener("click", () => { if (b.dataset.mode !== state.mode) setMode(b.dataset.mode); });
  }
  setMode(state.mode, true);
  try {
    const v = await api("GET", "/api/viewer");
    state.signedIn = !!v.signed_in;
    state.profile = v.profile || null;
  } catch (e) {
    // The viewer route only calls AniList when a token is stored, so an
    // error here means signed in with AniList unreachable, not signed out.
    state.signedIn = true;
    state.viewerError = errorText(e);
  }
  drawWho();
  window.addEventListener("hashchange", render);
  if (!state.signedIn && store.get("anicat_skip_signin") !== "1" && !location.hash.startsWith("#/title")) {
    location.hash = "#/signin";
  }
  render();
  checkVersion();
  pollPlayer();
}

boot();
</script>
