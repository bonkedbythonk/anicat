<!doctype html>
<html lang="en" data-skin="ink" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anicat</title>
<script>
  // Before the stylesheet paints: a light-skin viewer otherwise sees one
  // frame of the dark ground on every load.
  (function () {
    var skin = "ink", follow = true, theme = "dark";
    try {
      skin = localStorage.getItem("anicat_skin") || "ink";
      follow = localStorage.getItem("anicat_follow_system") !== "0";
      theme = localStorage.getItem("anicat_theme") || "dark";
    } catch (e) { /* storage refused: defaults */ }
    if (follow) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    if (skin === "oled") theme = "dark";
    document.documentElement.dataset.skin = skin;
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  /* The Sumi Ledger: ink or washi ground, one accent, hairlines, flat at
     rest. Values are the Mac app's SumiPalette (ThemeStore.swift). */
  :root, [data-skin=ink][data-theme=dark] {
    color-scheme: dark;
    --bg: #161310; --card: #1e1a15; --card-2: #26211b; --fg: #ede7dc;
    --accent: #8fb8dc; --accent-2: #a8c9e6;
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --faint: color-mix(in srgb, var(--fg) 32%, transparent);
    --line: rgba(237, 231, 220, 0.1);
    --danger: #e2674a; --ok: #8fb573; --warn: #d9a441;
    --shade: rgba(0, 0, 0, 0.45);
  }
  [data-skin=ink][data-theme=light] {
    color-scheme: light;
    --bg: #f1ece2; --card: #faf7f0; --card-2: #e9e3d6; --fg: #26221b;
    --accent: #2f5a76; --accent-2: #45789a;
    --muted: color-mix(in srgb, var(--fg) 65%, transparent);
    --faint: color-mix(in srgb, var(--fg) 40%, transparent);
    --line: rgba(38, 34, 27, 0.12);
    --danger: #a93a26; --ok: #4c6b35; --warn: #8c6310;
    --shade: rgba(38, 34, 27, 0.18);
  }
  [data-skin=sakura][data-theme=dark] {
    color-scheme: dark;
    --bg: #180a10; --card: #201016; --card-2: #2b1620; --fg: #fcfafb;
    --accent: #e0607e; --accent-2: #ea8ea3;
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --faint: color-mix(in srgb, var(--fg) 32%, transparent);
    --line: rgba(252, 250, 251, 0.1);
    --danger: #e2674a; --ok: #8fb573; --warn: #d9a441;
    --shade: rgba(0, 0, 0, 0.5);
  }
  [data-skin=sakura][data-theme=light] {
    color-scheme: light;
    --bg: #fdf5f7; --card: #ffffff; --card-2: #f6e6eb; --fg: #2d1822;
    --accent: #c04060; --accent-2: #d86884;
    --muted: color-mix(in srgb, var(--fg) 65%, transparent);
    --faint: color-mix(in srgb, var(--fg) 40%, transparent);
    --line: rgba(45, 24, 34, 0.12);
    --danger: #a93a26; --ok: #4c6b35; --warn: #8c6310;
    --shade: rgba(45, 24, 34, 0.16);
  }
  [data-skin=oled] {
    color-scheme: dark;
    --bg: #000000; --card: #0b0a09; --card-2: #16140f; --fg: #ede7dc;
    --accent: #8fb8dc; --accent-2: #a8c9e6;
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --faint: color-mix(in srgb, var(--fg) 32%, transparent);
    --line: rgba(237, 231, 220, 0.12);
    --danger: #e2674a; --ok: #8fb573; --warn: #d9a441;
    --shade: rgba(0, 0, 0, 0.6);
  }
  /* Sakura is the one skin that changes anything but colour: names go serif. */
  [data-skin=sakura] .t-name { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Yu Mincho", serif; }

  * { box-sizing: border-box; }
  /* Class rules below set display, which would otherwise beat the hidden
     attribute and leave an empty now-playing bar on screen. */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num, .meta, time { font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus { outline: none; }
  :focus-visible {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 0 4px var(--bg);
    border-radius: 8px;
  }
  img { color: transparent; }

  /* ---- buttons ---- */
  .btn {
    display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; white-space: nowrap;
    background: var(--card); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 10px;
    padding: .5rem .9rem; font-size: 13px; transition: background .15s, transform .08s;
  }
  .btn:hover { background: color-mix(in srgb, var(--card) 80%, var(--fg)); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.primary {
    background: var(--accent); color: var(--bg); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 14%, transparent);
    font-weight: 650; padding: .6rem 1.15rem;
  }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--muted); padding: .35rem .5rem; }
  .btn.ghost:hover { color: var(--fg); background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .link { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
  .link:hover { color: var(--accent-2); }

  /* A slash toggle: the choices as words, the chosen one in ink. */
  .slash { display: inline-flex; align-items: baseline; gap: .1rem; font-size: 13px; }
  .slash button {
    background: none; border: 0; padding: .15rem .25rem; cursor: pointer; color: var(--faint);
    transition: color .15s;
  }
  .slash button:hover { color: var(--muted); }
  .slash button[aria-pressed=true] { color: var(--fg); font-weight: 600; }
  .slash .sep { color: var(--faint); user-select: none; }

  /* Text-menu dropdown. */
  .menu-btn {
    display: inline-flex; align-items: center; gap: .3rem; background: none; border: 0; cursor: pointer;
    padding: .25rem .1rem; font-size: 13px; color: var(--muted);
  }
  .menu-btn:hover { color: var(--fg); }
  .menu-btn b { color: var(--fg); font-weight: 600; }
  .menu-btn svg { width: 12px; height: 12px; opacity: .7; }
  .popover {
    position: fixed; z-index: 60; min-width: 180px; max-height: min(420px, 70vh); overflow: auto;
    background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line), 0 14px 40px var(--shade);
    padding: .3rem; animation: pop .14s ease-out;
  }
  .popover button {
    display: flex; width: 100%; align-items: center; gap: .5rem; text-align: left; background: none; border: 0;
    padding: .42rem .65rem; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .popover button:hover, .popover button.hot { background: var(--card-2); }
  .popover button[aria-checked=true] { color: var(--accent); font-weight: 600; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

  input.field, textarea.field {
    background: var(--card); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 10px;
    padding: .6rem .8rem; width: 100%;
  }
  input.field:focus-visible, textarea.field:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); border-radius: 10px; }
  textarea.field { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 12px; min-height: 12rem; }

  /* ---- shell ---- */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  aside.side {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.1rem;
    background: var(--card); box-shadow: inset -1px 0 0 var(--line); padding: 1.25rem .9rem 1rem;
  }
  .brand { display: flex; align-items: center; gap: .55rem; padding: 0 .55rem; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .side .slash { padding: 0 .35rem; }
  nav.nav { display: flex; flex-direction: column; gap: .1rem; }
  nav.nav a {
    position: relative; display: flex; align-items: center; gap: .7rem; padding: .5rem .6rem; border-radius: 9px;
    color: var(--muted); font-size: 13.5px; transition: color .15s, background .15s;
  }
  nav.nav a svg { width: 18px; height: 18px; flex: none; }
  nav.nav a:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 4%, transparent); }
  nav.nav a[aria-current=page] { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  nav.nav a[aria-current=page]::before {
    content: ""; position: absolute; left: -.9rem; top: 22%; bottom: 22%; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .side .grow { flex: 1; }
  .who { display: flex; align-items: center; gap: .6rem; padding: .4rem .55rem; border-radius: 10px; font-size: 13px; }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--card-2); }
  .who .muted { font-size: 11.5px; }
  .side-foot { font-size: 11.5px; color: var(--faint); padding: 0 .55rem; }

  main#view { min-width: 0; padding: 0 0 7rem; }
  .page { max-width: 1240px; margin: 0 auto; padding: 1.75rem 2.5rem 0; animation: rise .32s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

  h1 { font-size: 26px; font-weight: 680; letter-spacing: -.015em; margin: .2rem 0 1rem; }
  h2 { font-size: 17px; font-weight: 650; margin: 0; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .error { color: var(--danger); }
  .okc { color: var(--ok); }
  .meta { font-size: 12px; color: var(--muted); }
  .dot::before { content: "\00b7"; margin: 0 .4rem; color: var(--faint); }

  .banner {
    display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .7rem 2.5rem; font-size: 13px;
    background: color-mix(in srgb, var(--accent) 9%, var(--bg)); box-shadow: inset 0 -1px 0 var(--line);
  }
  .banner code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; background: var(--card); padding: .25rem .5rem; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); overflow-x: auto; white-space: nowrap; max-width: 100%; }

  /* ---- hero ---- */
  .hero {
    position: relative; min-height: 400px; display: flex; align-items: flex-end; overflow: hidden;
    margin: 0 0 1.25rem; isolation: isolate;
  }
  .hero .art { position: absolute; inset: 0; z-index: -2; background: var(--card); }
  .hero .art img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: 0; transition: opacity .6s; }
  .hero .art img.in { opacity: 1; }
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 88%, transparent) 30%, color-mix(in srgb, var(--bg) 25%, transparent) 70%, transparent 100%),
      linear-gradient(0deg, var(--bg) 0%, transparent 45%);
  }
  .hero .copy { padding: 2.5rem 2.5rem 1.5rem; max-width: 640px; display: flex; flex-direction: column; gap: .7rem; }
  .hero .eyebrow { font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .hero h1 { font-size: 38px; line-height: 1.1; margin: 0; }
  .hero p.syn { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 60ch; }
  .hero .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .35rem; }
  .hero.skeleton .copy { opacity: 0; }

  /* ---- shelves ---- */
  .shelf { margin: 1.6rem 0 0; }
  .shelf-head { display: flex; align-items: baseline; gap: .8rem; margin-bottom: .75rem; }
  .shelf-head .sub { font-size: 12.5px; color: var(--muted); }
  .shelf-head .grow { flex: 1; }
  .shelf-head .arrows { display: flex; gap: .2rem; }
  .shelf-head .arrows button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: .2rem; border-radius: 6px; }
  .shelf-head .arrows button:hover { color: var(--fg); }
  .shelf-head .arrows svg { width: 18px; height: 18px; }
  .rail {
    display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 1rem; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; scrollbar-width: none; padding: 4px 4px 10px; margin: -4px -4px 0;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { scroll-snap-align: start; }
  .rail.wide { grid-auto-columns: 286px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.4rem 1rem; }

  .pc { display: flex; flex-direction: column; gap: .45rem; min-width: 0; }
  .pc .frame {
    position: relative; display: block; border-radius: 12px; overflow: hidden; aspect-ratio: 2 / 3; background: var(--card);
    transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s;
  }
  .pc .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pc:hover .frame, .wc:hover .frame { transform: translateY(-2px); box-shadow: 0 10px 28px var(--shade); }
  .pc .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .pc .tick > i { display: block; height: 100%; background: var(--accent); }
  .pc .name, .wc .name { font-size: 13px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc .meta { margin-top: -.2rem; }
  .pc .score { position: absolute; top: .45rem; right: .45rem; font-size: 11px; font-weight: 650; padding: .1rem .38rem; border-radius: 6px; background: color-mix(in srgb, var(--bg) 78%, transparent); color: var(--fg); }

  .wc { display: flex; flex-direction: column; gap: .5rem; min-width: 0; cursor: pointer; }
  .wc .frame { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--card); transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s; }
  .wc .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wc .frame .play {
    position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .18s;
    background: color-mix(in srgb, var(--bg) 35%, transparent);
  }
  .wc:hover .frame .play, .wc:focus-visible .frame .play { opacity: 1; }
  .play-dot { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; }
  .play-dot svg { width: 18px; height: 18px; margin-left: 2px; }
  .wc .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .wc .tick > i { display: block; height: 100%; background: var(--accent); }
  .wc .line { display: flex; gap: .6rem; align-items: baseline; }
  .wc .line .name { flex: 1; -webkit-line-clamp: 1; }
  .wc .line .go { font-size: 12px; color: var(--accent); white-space: nowrap; }

  .empty { color: var(--muted); padding: 1.2rem 0; }
  .skel { background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 12px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---- title page ---- */
  .backdrop { position: relative; height: 340px; overflow: hidden; margin-bottom: -210px; isolation: isolate; }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0; transition: opacity .6s; }
  .backdrop img.in { opacity: .55; }
  .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 8%, color-mix(in srgb, var(--bg) 40%, transparent) 70%, color-mix(in srgb, var(--bg) 20%, transparent)); }
  .tp { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 2.2rem; position: relative; }
  .tp .cover { width: 230px; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: 0 16px 44px var(--shade); }
  .tp .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tp h1 { font-size: 32px; line-height: 1.12; margin: 2.2rem 0 .3rem; }
  .tp .alt { color: var(--muted); font-size: 13px; margin-bottom: .55rem; }
  .tp .meta { font-size: 12.5px; display: flex; flex-wrap: wrap; row-gap: .2rem; }
  .tp .syn { max-width: 72ch; color: color-mix(in srgb, var(--fg) 84%, transparent); margin: .9rem 0 0; }
  .tp .syn.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: 1.2rem 0 0; }
  .actions .gap { flex: 0 0 .2rem; }
  .fav { background: none; border: 0; cursor: pointer; color: var(--muted); padding: .3rem; display: inline-flex; border-radius: 8px; }
  .fav svg { width: 20px; height: 20px; }
  .fav[aria-pressed=true] { color: var(--accent); }
  .fav[aria-pressed=true] svg path { fill: currentColor; }

  .tabs { display: flex; gap: 1.5rem; margin: 2.2rem 0 1.1rem; box-shadow: inset 0 -1px 0 var(--line); }
  .tabs button {
    background: none; border: 0; padding: .55rem 0; cursor: pointer; color: var(--muted); font-size: 14px; position: relative;
  }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected=true] { color: var(--fg); font-weight: 600; }
  .tabs button[aria-selected=true]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; }
  .tabs .count { color: var(--faint); font-weight: 400; margin-left: .3rem; font-size: 12px; }

  .groups { display: flex; flex-wrap: wrap; gap: .1rem .3rem; margin-bottom: 1rem; }
  .groups button { background: none; border: 0; cursor: pointer; color: var(--faint); padding: .2rem .4rem; font-size: 13px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .groups button:hover { color: var(--muted); }
  .groups button[aria-pressed=true] { color: var(--fg); font-weight: 600; background: var(--card); }

  .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.2rem 1rem; }
  .ep { display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
  .ep .frame { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--card); cursor: pointer; border: 0; padding: 0; display: block; width: 100%; transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s; }
  .ep .frame:hover { transform: translateY(-2px); box-shadow: 0 10px 28px var(--shade); }
  .ep .frame:disabled { cursor: default; transform: none; box-shadow: none; }
  .ep .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ep .frame .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ep .frame .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .18s; background: color-mix(in srgb, var(--bg) 35%, transparent); }
  .ep .frame:hover .play, .ep .frame:focus-visible .play { opacity: 1; }
  .ep .frame:disabled .play { display: none; }
  .ep .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .ep .tick > i { display: block; height: 100%; background: var(--accent); }
  .ep.watched .frame img { opacity: .55; }
  .ep .hd { display: flex; gap: .5rem; align-items: baseline; font-size: 13px; }
  .ep .hd .n { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .ep .hd .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  .ep .ft { display: flex; gap: .2rem .75rem; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .ep .ft .grow { flex: 1; }
  .ep .ft .link, .ep .ft .lk { font-size: 12px; }
  .lk { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); }
  .lk:hover { color: var(--fg); }

  .timeline { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 1.2rem; overflow-x: auto; padding: 1.6rem 4px 12px; scrollbar-width: thin; }
  .timeline::before { content: ""; position: absolute; left: 0; right: 0; top: .5rem; height: 1px; background: var(--line); min-width: 100%; }
  .tl { position: relative; display: flex; flex-direction: column; gap: .4rem; }
  .tl::before { content: ""; position: absolute; top: -1.35rem; left: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 3px var(--bg); }
  .tl.here::before { background: var(--accent); }
  .tl.aside { opacity: .8; }
  .tl .when { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -.25rem; }
  .tl.here .frame { box-shadow: 0 0 0 2px var(--accent); }

  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: .8rem; }

    .slot { grid-template-columns: 52px 40px minmax(0, 1fr); }
    .slot .r { grid-column: 3; text-align: left; }
  }
</style>

<div id="update-banner" class="banner" hidden></div>

  <aside class="side">

<script>
"use strict";

// ---- constants --------------------------------------------------------------

const SIGNIN_URL = "https://anilist.co/api/v2/oauth/authorize?client_id=20148&response_type=token";
const INSTALL_COMMAND = "irm https://raw.githubusercontent.com/bonkedbythonk/anicat/master/scripts/install_windows.ps1 | iex";
// Same 85% the server replays from the start past, and the player marks
// watched at. A resume offered above it lands in the credits.
const RESUME_LIMIT = 0.85;
// The Mac app's chapter and episode lists open in groups of 50; a
// thousand-episode series drawn at once took seconds to lay out.
const GROUP_SIZE = 50;
const ANIME_STATUSES = ["CURRENT", "REPEATING", "PAUSED", "PLANNING", "COMPLETED", "DROPPED"];
const CINEMA_STATUSES = ["CURRENT", "PLANNING", "COMPLETED", "DROPPED"];
const STATUS_LABELS = {
  CURRENT: "Watching", REPEATING: "Rewatching", PAUSED: "Paused",
  PLANNING: "Planning", COMPLETED: "Completed", DROPPED: "Dropped",
};
const PHASES = [
  ["remembered", "Trying the release that played last time"],
  ["searching", "Searching for releases"],
  ["connecting", "Connecting to peers"],
  ["buffering", "Buffering"],
];
const FORMAT_LABELS = { TV: "TV", TV_SHORT: "TV short", MOVIE: "Film", SPECIAL: "Special", OVA: "OVA", ONA: "ONA", MUSIC: "Music" };
const GENRES = ["Action", "Adventure", "Comedy", "Drama", "Ecchi", "Fantasy", "Horror", "Mahou Shoujo", "Mecha", "Music",
  "Mystery", "Psychological", "Romance", "Sci-Fi", "Slice of Life", "Sports", "Supernatural", "Thriller"];
const SKINS = [
  { id: "ink", label: "Ink and index", dark: ["#161310", "#8fb8dc"], light: ["#f1ece2", "#2f5a76"] },
  { id: "sakura", label: "Sakura zen", dark: ["#180a10", "#e0607e"], light: ["#fdf5f7", "#c04060"] },
  { id: "oled", label: "OLED", dark: ["#000000", "#8fb8dc"] },
];

const ICONS = {
  paw: '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6.2" cy="9.6" rx="2.1" ry="2.6"/><ellipse cx="10" cy="5.8" rx="2.1" ry="2.7"/><ellipse cx="14.6" cy="5.8" rx="2.1" ry="2.7"/><ellipse cx="18.2" cy="9.6" rx="2.1" ry="2.6"/><path d="M12.2 11.2c-3.2 0-6.4 4.3-6.4 6.9 0 1.7 1.3 2.6 2.9 2.6 1.4 0 2.3-.8 3.5-.8s2.1.8 3.5.8c1.6 0 2.9-.9 2.9-2.6 0-2.6-3.2-6.9-6.4-6.9z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>',
  library: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5v15M9 4.5v15"/><path d="m13 5.2 3.6-.9 3.4 14.4-3.6.9z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.2 4.1A.8.8 0 0 0 7 4.8z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 19.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>',
};

// ---- storage ----------------------------------------------------------------

// Private windows and some browser settings throw on any access to
// localStorage; the page must still run with nothing remembered.
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* not persisted */ } },
  del(key) { try { localStorage.removeItem(key); } catch { /* not persisted */ } },
};

const state = {
  mode: store.get("anicat_mode") === "cinema" ? "cinema" : "anime",
  signedIn: false,
  profile: null,
  viewerError: null,
  playerRouteMissing: false,
  renderToken: 0,
};

// ---- helpers ----------------------------------------------------------------

class ApiFailure extends Error {
  constructor(status, message, anilistDown) {
    super(message);
    this.status = status;
    this.anilistDown = anilistDown;
  }
}

async function api(method, path, body) {
  const init = { method, headers: {} };
  if (body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch(path, init);
  } catch (e) {
    throw new ApiFailure(0, "The Anicat server is not answering. Is it still running?", false);
  }
  if (res.status === 204) return null;
  const type = res.headers.get("Content-Type") || "";
  if (!type.includes("application/json")) {
    const text = await res.text();
    if (!res.ok) throw new ApiFailure(res.status, text || res.statusText, false);
    return text;
  }
  const data = await res.json();
  if (!res.ok) {
    throw new ApiFailure(res.status, (data && data.error) || res.statusText, !!(data && data.anilist_down));
  }
  return data;
}

function errorText(e) {
  if (e instanceof ApiFailure && e.anilistDown) {
    return "AniList is having an outage; signed-in features may still work.";
  }
  return (e && e.message) || String(e);
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

// The icon strings are constants in this file; nothing from a response ever
// reaches innerHTML.
function icon(name) {
  const span = document.createElement("span");
  span.style.display = "contents";
  span.innerHTML = ICONS[name] || "";
  return span.firstElementChild || span;
}

function img(src, attrs) {
  if (!src) return el("div", { class: "ph" });
  const node = el("img", Object.assign({ src, alt: "", loading: "lazy", decoding: "async", referrerpolicy: "no-referrer" }, attrs || {}));
  node.addEventListener("load", () => node.classList.add("in"), { once: true });
  // A dead CDN link leaves a broken-image glyph; the card ground reads better.
  node.addEventListener("error", () => { node.style.visibility = "hidden"; }, { once: true });
  return node;
}

function clock(seconds) {
  if (seconds === null || seconds === undefined || !isFinite(seconds)) return "--:--";
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = String(s % 60).padStart(2, "0");
  return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

function bytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

function hours(seconds) {
  const h = seconds / 3600;
  if (h >= 100) return `${Math.round(h)} h`;
  if (h >= 1) return `${h.toFixed(1)} h`;
  return `${Math.round(seconds / 60)} min`;
}

function humanize(s) {
  const t = String(s || "").replace(/[_-]+/g, " ").toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function formatLabel(f) { return f ? (FORMAT_LABELS[f] || humanize(f)) : null; }

// AniList synopses are HTML. Parsed into an inert document (scripts never
// run there, images never load), then rebuilt keeping only text, <br> and
// <i>; nothing from the source reaches innerHTML.
function sanitizedSynopsis(html) {
  const out = document.createDocumentFragment();
  if (!html) return out;
  const doc = new DOMParser().parseFromString(`<body>${html}</body>`, "text/html");
  const walk = (src, dst) => {
    for (const node of src.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) {
        dst.append(document.createTextNode(node.textContent));
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        const name = node.nodeName.toLowerCase();
        if (name === "br") dst.append(document.createElement("br"));
        else if (name === "i" || name === "em") { const i = document.createElement("i"); walk(node, i); dst.append(i); }
        else if (name !== "script" && name !== "style") walk(node, dst);
      }
    }
  };
  walk(doc.body, out);
  return out;
}

function plainSynopsis(html) {
  const div = document.createElement("div");
  div.append(sanitizedSynopsis(html));
  return div.textContent.replace(/\s+/g, " ").trim();
}

async function mapLimited(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  const worker = async () => {
    while (next < items.length) {
      const i = next++;
      try { results[i] = await fn(items[i], i); } catch (e) { results[i] = { error: e }; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

function isCinema(catalog) { return catalog === "tmdb_movie" || catalog === "tmdb_tv"; }

// Detail responses are fetched again by Up Next, Library and the title page;
// a short-lived memo keeps one navigation from asking twice.
const detailMemo = new Map();
function fetchDetail(catalog, id, fresh) {
  const key = `${catalog}:${id}`;
  if (!fresh && detailMemo.has(key)) return detailMemo.get(key);
  const p = catalog === "anilist"
    ? api("GET", `/api/media/${id}`)
    : api("GET", `/api/cinema/${id}?catalog=${catalog}`);
  detailMemo.set(key, p);
  p.catch(() => detailMemo.delete(key));
  setTimeout(() => detailMemo.delete(key), 60_000);
  return p;
}

function titleHref(catalog, id) { return `#/title/${catalog}/${id}`; }

function preferDub(catalog, id) { return store.get(`anicat_dub_${catalog}_${id}`) === "1"; }

function copyText(text, fallbackHost) {
  const fallback = () => {
    fallbackHost.replaceChildren(
      el("p", { class: "muted", text: "Copying was not allowed. Select the text below and copy it by hand." }),
      el("textarea", { class: "field", readonly: true, rows: 12 }, text),
    );
    const ta = fallbackHost.querySelector("textarea");
    ta.focus();
    ta.select();
  };
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => { fallback(); return false; });
  }
  fallback();
  return Promise.resolve(false);
}

function toast(message, isError) {
  const node = el("div", { class: "toast" + (isError ? " error" : ""), role: "status" }, message);
  document.getElementById("toasts").append(node);
  setTimeout(() => node.remove(), isError ? 7000 : 3200);
}

// ---- controls ---------------------------------------------------------------

function slash(options, value, onChange, label) {
  const wrap = el("div", { class: "slash", role: "group", "aria-label": label || null });
  const buttons = [];
  options.forEach(([v, text], i) => {
    if (i) wrap.append(el("span", { class: "sep", text: "/" }));
    const b = el("button", { type: "button", "aria-pressed": String(v === value), text,
      onclick: () => {
        if (b.getAttribute("aria-pressed") === "true") return;
        for (const o of buttons) o.setAttribute("aria-pressed", String(o === b));
        onChange(v);
      } });
    buttons.push(b);
    wrap.append(b);
  });
  return wrap;
}

let openPopover = null;
function closePopover() {
  if (!openPopover) return;
  openPopover.remove();
  openPopover = null;
}
document.addEventListener("pointerdown", (e) => {
  if (openPopover && !openPopover.contains(e.target) && !(openPopover.owner && openPopover.owner.contains(e.target))) closePopover();
});
// Capture phase sees the popover's own scroll too; closing on that shut the
// Year menu the moment it opened, focusing a saved year below the fold.
window.addEventListener("scroll", (e) => {
  if (openPopover && e.target instanceof Node && openPopover.contains(e.target)) return;
  closePopover();
}, true);
window.addEventListener("resize", closePopover);

// A text-menu dropdown: "Genre Any" as words, the choices in a popover.
function menu({ label, options, value, onChange }) {
  const current = () => options.find(([v]) => v === btn.value) || options[0];
  const valueNode = el("b");
  const btn = el("button", { type: "button", class: "menu-btn", "aria-haspopup": "listbox" },
    label ? el("span", {}, label) : null, valueNode, icon("chevron"));
  btn.value = value === undefined ? options[0][0] : value;
  const sync = () => { valueNode.textContent = current()[1]; };
  btn.set = (v) => { btn.value = v; sync(); };
  sync();
  btn.addEventListener("click", () => {
    if (openPopover && openPopover.owner === btn) { closePopover(); return; }
    closePopover();
    const pop = el("div", { class: "popover", role: "listbox" });
    pop.owner = btn;
    let hot = Math.max(0, options.findIndex(([v]) => v === btn.value));
    const items = options.map(([v, text], i) => el("button", {
      type: "button", role: "option", "aria-checked": String(v === btn.value), text,
      onclick: () => { closePopover(); if (v !== btn.value) { btn.set(v); onChange(v); } btn.focus(); },
      onmouseenter: () => { hot = i; paint(); },
    }));
    const paint = () => items.forEach((it, i) => it.classList.toggle("hot", i === hot));
    pop.append(...items);
    pop.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { hot = Math.min(items.length - 1, hot + 1); paint(); items[hot].focus(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { hot = Math.max(0, hot - 1); paint(); items[hot].focus(); e.preventDefault(); }
      else if (e.key === "Escape") { closePopover(); btn.focus(); e.stopPropagation(); }
    });
    document.getElementById("overlay-root").append(pop);
    const r = btn.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
    pop.style.top = `${r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6}px`;
    openPopover = pop;
    paint();
    items[hot].focus();
    items[hot].scrollIntoView({ block: "nearest" });
  });
  return btn;
}

function modal(title, ...body) {
  const root = document.getElementById("overlay-root");
  const prev = document.activeElement;
  const close = () => {
    overlay.remove();
    document.removeEventListener("keydown", onKey);
    if (prev && prev.focus) prev.focus();
  };
  const onKey = (e) => { if (e.key === "Escape" && !openPopover) close(); };
  const closeBtn = el("button", { type: "button", class: "btn ghost", text: "Close", onclick: close });
  const overlay = el("div", { class: "overlay", onclick: (e) => { if (e.target === overlay) close(); } },
    el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
      el("header", {}, el("h3", {}, title), closeBtn),
      ...body,
    ));
  root.append(overlay);
  document.addEventListener("keydown", onKey);
  closeBtn.focus();
  return { close, closeBtn, overlay };
}

// ---- cards and shelves ------------------------------------------------------

function posterCard(item, opts = {}) {
  const href = opts.href || titleHref(item.catalog, item.catalog_id);
  const total = item.episodes || 0;
  const frac = opts.fraction !== undefined ? opts.fraction : (total && item.progress ? Math.min(1, item.progress / total) : 0);
  return el("div", { class: "pc" },
    el("a", { class: "frame", href, "aria-label": item.title },
      img(item.cover_image),
      opts.score ? el("span", { class: "score num" }, opts.score) : null,
      frac > 0 ? el("span", { class: "tick" }, el("i", { style: `width:${(frac * 100).toFixed(1)}%` })) : null,
    ),
    el("a", { class: "name t-name", href }, item.title),
    opts.sub !== "" ? el("div", { class: "meta" }, opts.sub !== undefined ? opts.sub : summarySub(item)) : null,
  );
}

function summarySub(item) {
  const bits = [];
  if (item.catalog === "tmdb_movie") bits.push("Film");
  else if (item.catalog === "tmdb_tv") bits.push("Series");
  else if (item.format) bits.push(formatLabel(item.format));
  // TMDB rows report a film as one episode; only AniList counts mean anything.
  if (item.catalog === "anilist") {
    if (item.progress && item.episodes) bits.push(`${item.progress} / ${item.episodes}`);
    else if (item.progress) bits.push(`${item.progress} seen`);
    else if (item.episodes) bits.push(`${item.episodes} ep`);
  }
  return bits.join(" · ");
}

function scoreOf(item) { return item.average_score ? `${item.average_score}%` : null; }

function grid(items, opts) {
  if (!items.length) return el("p", { class: "empty", text: "Nothing here." });
  return el("div", { class: "grid" }, items.map((it) => posterCard(it, opts ? opts(it) : {})));
}

// A horizontal shelf. The loader answers card nodes; an empty answer or an
// error takes the whole shelf off the page unless `loud` is set, so a flaky
// optional row never leaves a broken heading behind.
function shelf(host, title, loader, opts = {}) {
  const rail = el("div", { class: "rail" + (opts.wide ? " wide" : "") });
  const step = (dir) => rail.scrollBy({ left: dir * rail.clientWidth * 0.85, behavior: "smooth" });
  const sub = el("span", { class: "sub" });
  const section = el("section", { class: "shelf" },
    el("div", { class: "shelf-head" },
      el("h2", {}, title), sub, el("span", { class: "grow" }),
      el("div", { class: "arrows" },
        el("button", { type: "button", "aria-label": "Scroll left", onclick: () => step(-1) }, icon("left")),
        el("button", { type: "button", "aria-label": "Scroll right", onclick: () => step(1) }, icon("right"))),
    ),
    rail);
  for (let i = 0; i < (opts.wide ? 4 : 7); i++) {
    rail.append(el("div", { class: "skel", style: opts.wide ? "aspect-ratio:16/9" : "aspect-ratio:2/3" }));
  }
  host.append(section);
  return (async () => {
    try {
      const out = await loader(sub);
      const nodes = Array.isArray(out) ? out : [];
      if (!nodes.length) {
        if (opts.loud) rail.replaceWith(el("p", { class: "empty", text: opts.emptyText || "Nothing here." }));
        else section.remove();
        return [];
      }
      rail.replaceChildren(...nodes);
      return nodes;
    } catch (e) {
      if (opts.loud) rail.replaceWith(el("p", { class: "error", text: errorText(e) }));
      else section.remove();
      return [];
    }
  })();
}

function page(host) {
  const p = el("div", { class: "page" });
  host.append(p);
  return p;
}

// ---- playback ---------------------------------------------------------------

let resolving = false;

async function play({ catalog, catalogId, episode, title, chosenName, fromStart, cover }) {
  if (resolving) { toast("A play is already starting."); return; }
  resolving = true;
  const dub = preferDub(catalog, catalogId);
  const steps = PHASES.map(([key, text]) => el("li", { "data-phase": key, text }));
  const detail = el("div", { class: "detail" });
  const headline = el("div", { style: "font-weight:650;font-size:15px" },
    catalog === "tmdb_movie" ? (title || "Film") : `${title || "Episode"}`);
  const sub = el("div", { class: "meta" }, catalog === "tmdb_movie" ? "Film" : `Episode ${episode}${dub ? " · Dub" : ""}`);
  const m = modal("Starting playback",
    el("div", { class: "resolving" },
      img(cover),
      el("div", {}, headline, sub, el("ul", { class: "steps" }, steps), detail)));
  // Only "remembered" is optional; hide it until the engine says it is trying one.
  steps[0].hidden = true;

  let done = false;
  const poll = async () => {
    while (!done) {
      try {
        const p = await api("GET", `/api/resolve-progress/${catalog}/${catalogId}/${episode}`);
        if (!done && p) {
          const at = PHASES.findIndex(([k]) => k === p.phase);
          if (p.phase === "remembered") steps[0].hidden = false;
          steps.forEach((li, i) => {
            li.className = i < at ? "done" : i === at ? "on" : "";
          });
          const bits = [];
          if (p.release) bits.push(p.release);
          if (p.candidates) bits.push(`${p.candidates} candidates`);
          if (p.attempt > 1) bits.push(`attempt ${p.attempt}`);
          if (p.bytes_per_second) bits.push(`${bytes(p.bytes_per_second)}/s`);
          detail.textContent = bits.join(" · ");
        }
      } catch { /* the play call reports the real failure */ }
      await new Promise((r) => setTimeout(r, 500));
    }
  };
  steps[1].className = "on";
  poll();

  try {
    await api("POST", "/api/play", {
      catalog, catalog_id: catalogId, episode, title: title || null,
      prefer_dub: dub, chosen_name: chosenName || null, from_start: !!fromStart,
    });
    done = true;
    m.close();
    toast("Playing in mpv.");
    state.playerRouteMissing = false;
    pollPlayer();
  } catch (e) {
    done = true;
    steps.forEach((li) => { if (li.className === "on") li.className = ""; });
    detail.className = "detail error";
    detail.textContent = `Could not start playback. ${errorText(e)}`;
  } finally {
    resolving = false;
  }
}

function openReleases({ catalog, catalogId, episode, title, cover }) {
  const body = el("div", { class: "body" }, el("p", { class: "muted", text: "Searching the indexers..." }));
  const sortHost = el("div", { style: "padding:.7rem 1.25rem 0" });
  const m = modal(catalog === "tmdb_movie" ? "Choose a release" : `Choose a release for episode ${episode}`, sortHost, body);

  const dub = preferDub(catalog, catalogId);
  const qs = new URLSearchParams({ catalog, catalog_id: catalogId, episode, prefer_dub: dub });
  if (title) qs.set("title", title);
  api("GET", `/api/releases?${qs}`).then((data) => {
    const rows = (data && data.releases) || [];
    if (!rows.length) {
      body.replaceChildren(el("p", { class: "empty", text: "No releases found for this episode." }));
      return;
    }
    let sort = store.get("anicat_release_sort") || "seeders";
    const draw = () => {
      const sorted = rows.slice();
      if (sort === "seeders") sorted.sort((a, b) => (b.seeders_known - a.seeders_known) || (b.seeders - a.seeders));
      else if (sort === "small") sorted.sort((a, b) => (a.size_bytes || Infinity) - (b.size_bytes || Infinity));
      else if (sort === "large") sorted.sort((a, b) => (b.size_bytes || 0) - (a.size_bytes || 0));
      body.replaceChildren(el("div", { class: "rels" }, sorted.map((r) =>
        el("button", { type: "button", class: "rel",
          onclick: () => { m.close(); play({ catalog, catalogId, episode, title, chosenName: r.name, cover }); } },
          el("span", { class: "nm" }, r.name,
            r.name === data.remembered || r.is_dub
              ? el("small", {}, [r.name === data.remembered ? "Played last time" : null, r.is_dub ? "Dub" : null].filter(Boolean).join(" · "))
              : null),
          el("span", { class: "sz" }, r.size_bytes ? bytes(r.size_bytes) : ""),
          // A count the indexer never reported is not zero seeders.
          el("span", { class: "sd" + (r.seeders_known && r.seeders >= 20 ? " hi" : "") },
            r.seeders_known ? `${r.seeders} seeders` : "seeders unknown"),
        ))));
    };
    sortHost.replaceChildren(el("div", { class: "filters", style: "margin:0" },
      el("span", { class: "meta" }, `${rows.length} releases`),
      menu({ label: "Sort", value: sort, options: [["seeders", "Seeders"], ["small", "Smallest"], ["large", "Largest"], ["found", "As found"]],
        onChange: (v) => { sort = v; store.set("anicat_release_sort", v); draw(); } })));
    draw();
  }, (e) => {
    body.replaceChildren(el("p", { class: "error", text: errorText(e) }));
  });
}

// ---- now playing ------------------------------------------------------------

let playerTimer = null;

async function pollPlayer() {
  clearTimeout(playerTimer);
  const bar = document.getElementById("nowplaying");
  // A 404 means this server has no player route yet. Polling on would put a
  // failed request in the console every two seconds; a successful play
  // clears the flag and polling starts again.
  if (state.playerRouteMissing) { bar.hidden = true; return; }
  if (document.visibilityState === "visible") {
    try {
      const p = await api("GET", "/api/player");
      renderPlayer(p);
    } catch (e) {
      bar.hidden = true;
      if (e instanceof ApiFailure && e.status === 404) { state.playerRouteMissing = true; return; }
    }
  }
  playerTimer = setTimeout(pollPlayer, 2000);
}

let npKey = null;
function renderPlayer(p) {
  const bar = document.getElementById("nowplaying");
  if (!p || !p.active) { bar.hidden = true; npKey = null; return; }
  const key = `${p.catalog}:${p.catalog_id}:${p.episode}`;
  const href = p.catalog && p.catalog_id ? titleHref(p.catalog, p.catalog_id) : null;
  const bits = [];
  if (p.episode !== null && p.episode !== undefined && p.catalog !== "tmdb_movie") bits.push(`Episode ${p.episode}`);
  bits.push(`${clock(p.position)} / ${clock(p.duration)}`);
  if (p.paused) bits.push("Paused");
  if (p.next_ready) bits.push("Next episode ready");
  const frac = p.duration > 0 ? Math.min(1, (p.position || 0) / p.duration) : 0;
  if (npKey !== key) {
    npKey = key;
    const cover = el("div", { class: "ph" });
    bar.replaceChildren(
      cover,
      el("div", { style: "min-width:0" },
        href ? el("a", { class: "t t-name", href }, p.title || "Playing") : el("span", { class: "t" }, p.title || "Playing"),
        el("div", { class: "meta", "data-np": "meta" }),
        el("div", { class: "prog" }, el("i", { "data-np": "bar" }))),
      el("button", { type: "button", class: "btn", onclick: stopPlayer }, icon("stop"), "Stop"),
    );
    if (p.catalog && p.catalog_id) {
      fetchDetail(p.catalog, p.catalog_id).then((d) => { if (npKey === key && d.cover_image) cover.replaceWith(img(d.cover_image)); }, () => {});
    }
  }
  bar.querySelector('[data-np="meta"]').textContent = bits.join(" · ");
  bar.querySelector('[data-np="bar"]').style.width = `${(frac * 100).toFixed(2)}%`;
  bar.hidden = false;
}

async function stopPlayer() {
  try {
    await api("POST", "/api/player/stop");
  } catch (e) {
    if (e instanceof ApiFailure && e.status === 404) {
      try { await api("POST", "/api/stop"); } catch (e2) { toast(errorText(e2), true); }
    } else {
      toast(errorText(e), true);
    }
  }
  document.getElementById("nowplaying").hidden = true;
  npKey = null;
  pollPlayer();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") pollPlayer();
});

// ---- up next ----------------------------------------------------------------

// One card per title, newest watch first. A title whose last episode stopped
// short of the watched line resumes it; one that finished it offers the next.
async function upNextFrom(rows, wantCinema) {
  const seen = new Map();
  for (const r of rows) {
    if (isCinema(r.catalog) !== wantCinema) continue;
    const key = `${r.catalog}:${r.catalog_id}`;
    if (!seen.has(key)) seen.set(key, r);
  }
  const latest = [...seen.values()].slice(0, 14);
  const cards = await mapLimited(latest, 4, async (r) => {
    const [detail, prog] = await Promise.all([
      fetchDetail(r.catalog, r.catalog_id),
      api("GET", `/api/progress/${r.catalog_id}?episode=${r.episode_number}&catalog=${r.catalog}`),
    ]);
    const fraction = prog && prog.duration > 0 ? prog.stop_time / prog.duration : 0;
    const resumable = prog && prog.stop_time > 0 && fraction < RESUME_LIMIT;
    let episode = r.episode_number;
    if (!resumable) {
      episode = r.episode_number + 1;
      const row = (detail.episodes || []).find((e) => e.number === episode);
      if (r.catalog === "tmdb_movie" || !row || !row.is_aired) return null;
    }
    return { detail, catalog: r.catalog, episode, resumable, at: resumable ? prog.stop_time : 0, fraction: resumable ? fraction : 0 };
  });
  return cards.filter((c) => c && !c.error).sort((a, b) => (b.resumable ? 1 : 0) - (a.resumable ? 1 : 0));
}

async function upNextCards() {
  const activity = await api("GET", "/api/activity?limit=200");
  const cards = await upNextFrom(activity, state.mode === "cinema");
  if (state.mode === "anime" && state.signedIn) {
    // Titles watching on AniList with nothing played on this machine yet.
    const current = await api("GET", "/api/user-list?status=CURRENT").catch(() => []);
    const shown = new Set(cards.map((c) => c.detail.catalog_id));
    const extra = current
      .filter((m) => !shown.has(m.catalog_id))
      .filter((m) => {
        const next = (m.progress || 0) + 1;
        const aired = m.released_episodes || (m.next_episode ? m.next_episode - 1 : m.episodes);
        return !aired || next <= aired;
      })
      .slice(0, 8);
    const more = await mapLimited(extra, 4, async (m) => {
      const detail = await fetchDetail("anilist", m.catalog_id);
      const episode = (m.progress || 0) + 1;
      const row = (detail.episodes || []).find((e) => e.number === episode);
      if (row && !row.is_aired) return null;
      return { detail, catalog: "anilist", episode, resumable: false, at: 0, fraction: 0 };
    });
    cards.push(...more.filter((c) => c && !c.error));
  }
  return cards;
}

function cardLabel(c) {
  if (c.catalog === "tmdb_movie") return c.resumable ? `Resume at ${clock(c.at)}` : "Play";
  return c.resumable ? `Episode ${c.episode} · ${clock(c.at)}` : `Episode ${c.episode}`;
}

function playCard(c) {
  play({ catalog: c.catalog, catalogId: c.detail.catalog_id, episode: c.episode, title: c.detail.title, cover: c.detail.cover_image });
}

function wideCard(c) {
  const row = (c.detail.episodes || []).find((e) => e.number === c.episode);
  const still = (row && row.thumbnail) || c.detail.banner_image || c.detail.cover_image;
  const node = el("div", { class: "wc", tabindex: "0", role: "button", "aria-label": `${c.detail.title}, ${cardLabel(c)}`,
    onclick: () => playCard(c),
    onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playCard(c); } } },
    el("div", { class: "frame" },
      img(still),
      el("div", { class: "play" }, el("span", { class: "play-dot" }, icon("play"))),
      c.fraction > 0 ? el("span", { class: "tick" }, el("i", { style: `width:${(c.fraction * 100).toFixed(1)}%` })) : null),
    el("div", { class: "line" },
      el("a", { class: "name t-name", href: titleHref(c.catalog, c.detail.catalog_id), onclick: (e) => e.stopPropagation() }, c.detail.title),
      el("span", { class: "go num" }, c.resumable ? "Resume" : "Play")),
    el("div", { class: "meta" }, cardLabel(c), row && row.title && c.catalog !== "tmdb_movie" ? el("span", { class: "dot" }, row.title) : null),
  );
  return node;
}

// ---- views: home ------------------------------------------------------------

function hero(host) {
  const art = el("div", { class: "art" });
  const copy = el("div", { class: "copy" });
  const node = el("section", { class: "hero skeleton" }, art, copy);
  host.append(node);
  return {
    fill({ eyebrow, detail, catalog, primary, secondary }) {
      node.classList.remove("skeleton");
      const banner = detail.banner_image || detail.cover_image;
      if (banner) art.replaceChildren(img(banner, { loading: "eager" }));
      const meta = [formatLabel(detail.format), detail.year, detail.studio, detail.average_score ? `${detail.average_score}%` : null,
        (detail.genres || []).slice(0, 3).join(", ") || null].filter(Boolean);
      copy.replaceChildren(
        el("div", { class: "eyebrow" }, eyebrow),
        el("a", { href: titleHref(catalog, detail.catalog_id) }, el("h1", { class: "t-name" }, detail.title)),
        el("div", { class: "meta" }, meta.map((m, i) => el("span", { class: i ? "dot" : null }, m))),
        el("p", { class: "syn" }, plainSynopsis(detail.synopsis)),
        el("div", { class: "row" }, primary, secondary),
      );
    },
    remove() { node.remove(); },
  };
}

async function viewHome(host, token) {
  const h = hero(host);
  const p = page(host);
  p.style.paddingTop = "0";
  let heroDone = false;
  const fillHero = (opts) => { if (!heroDone && token === state.renderToken) { heroDone = true; h.fill(opts); } };

  const upNext = shelf(p, state.mode === "cinema" || state.signedIn ? "Up next" : "Continue watching", async () => {
    const cards = await upNextCards();
    if (cards.length) {
      const c = cards[0];
      fillHero({
        eyebrow: c.resumable ? "Continue watching" : "Up next",
        detail: c.detail, catalog: c.catalog,
        primary: el("button", { type: "button", class: "btn primary", onclick: () => playCard(c) }, icon("play"),
          c.catalog === "tmdb_movie" ? (c.resumable ? `Resume at ${clock(c.at)}` : "Play") : `${c.resumable ? "Resume" : "Play"} episode ${c.episode}`),
        secondary: el("a", { class: "btn", href: titleHref(c.catalog, c.detail.catalog_id) }, "Details"),
      });
    }
    return cards.map(wideCard);
  }, { wide: true });

  if (state.mode === "anime") {
    if (!state.signedIn) {
      p.prepend(el("div", { class: "panel", style: "margin-top:1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap" },
        el("span", { style: "flex:1;min-width:240px" }, "Sign in to AniList for your list, Up Next across devices, and recommendations."),
        el("a", { class: "btn primary", href: "#/signin" }, "Sign in")));
    }
    const today = airingToday(p);
    const trending = shelf(p, "Trending now", async () => {
      const rows = await api("GET", "/api/trending?limit=24");
      if (rows.length) heroFromSummary(rows[0], "Trending now", "anilist", fillHero, token, upNext);
      return rows.map((r) => posterCard(r, { score: scoreOf(r) }));
    });
    if (state.signedIn) {
      shelfRecommendations(p);
    }
    shelf(p, "Airing this season", async () =>
      (await api("GET", "/api/discover?status=RELEASING&limit=24")).map((r) => posterCard(r, { score: scoreOf(r) })));
    shelf(p, "Most anticipated", async () =>
      (await api("GET", "/api/discover?status=NOT_YET_RELEASED&limit=24")).map((r) => posterCard(r, { sub: formatLabel(r.format) || "" })));
    await Promise.all([upNext, trending, today]);
  } else {
    let kinds = [];
    try { kinds = await api("GET", "/api/cinema/rows"); } catch (e) {
      p.append(el("p", { class: "error", text: errorText(e) }));
    }
    let first = true;
    for (const kind of kinds) {
      const isFirst = first;
      first = false;
      shelf(p, humanize(kind), async () => {
        const rows = await api("GET", `/api/cinema/row/${encodeURIComponent(kind)}`);
        if (isFirst && rows.length) heroFromSummary(rows[0], humanize(kind), rows[0].catalog, fillHero, token, upNext);
        return rows.map((r) => posterCard(r, { score: scoreOf(r) }));
      });
    }
    await upNext;
  }
  if (!heroDone) {
    // Waited on: Up Next wins the spotlight when it has anything.
    setTimeout(() => { if (!heroDone && token === state.renderToken) h.remove(); }, 6000);
  }
}

// The spotlight falls back to the first trending title, but only once Up Next
// has had its say; otherwise a fast trending answer took the hero from the
// episode the viewer was halfway through.
async function heroFromSummary(item, eyebrow, catalog, fillHero, token, upNext) {
  await upNext;
  if (token !== state.renderToken) return;
  try {
    const d = await fetchDetail(catalog, item.catalog_id);
    const first = (d.episodes || []).find((e) => e.is_aired);
    fillHero({
      eyebrow, detail: d, catalog,
      primary: first
        ? el("button", { type: "button", class: "btn primary", onclick: () =>
            play({ catalog, catalogId: d.catalog_id, episode: first.number, title: d.title, cover: d.cover_image }) },
            icon("play"), catalog === "tmdb_movie" ? "Play" : `Play episode ${first.number}`)
        : el("a", { class: "btn primary", href: titleHref(catalog, d.catalog_id) }, "Details"),
      secondary: first ? el("a", { class: "btn", href: titleHref(catalog, d.catalog_id) }, "Details") : null,
    });
  } catch { /* the hero keeps waiting for another source */ }
}

function airingToday(p) {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const from = Math.floor(start.getTime() / 1000);
  return shelf(p, "Airing today", async (sub) => {
    const slots = await api("GET", `/api/schedule?from=${from}&to=${from + 86400}`);
    const mine = slots.filter((s) => s.on_user_list);
    const pick = (mine.length ? mine : slots).sort((a, b) => a.airing_at - b.airing_at);
    sub.textContent = mine.length ? "From your list" : "";
    const now = Date.now() / 1000;
    return pick.map((s) => posterCard({ catalog: "anilist", catalog_id: s.catalog_id, title: s.title, cover_image: s.cover_image },
      { sub: `${s.airing_at <= now ? "Out" : timeOf(s.airing_at)} · Ep ${s.episode}` }));
  });
}

function shelfRecommendations(p) {
  return shelf(p, "Because you watched", async (sub) => {
    const rows = await api("GET", "/api/recommendations?limit=24");
    const because = [...new Set(rows.map((r) => r.because_title))].slice(0, 3);
    sub.textContent = because.join(", ");
    return rows.map((r) => posterCard(r.media, { sub: `For ${r.because_title}`, score: scoreOf(r.media) }));
  });
}

function timeOf(unix) {
  return new Date(unix * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// ---- views: schedule --------------------------------------------------------

async function viewSchedule(host, token) {
  const p = page(host);
  if (state.mode === "cinema") { location.hash = "#/"; return; }
  p.append(el("h1", {}, "Schedule"));
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const from = Math.floor(start.getTime() / 1000);
  let onlyMine = state.signedIn && store.get("anicat_schedule_all") !== "1";
  let day = Number(store.get("anicat_schedule_day_offset") || 0);
  if (!(day >= 0 && day < 7)) day = 0;

  const days = el("div", { class: "days" });
  const list = el("div", { class: "slots" }, el("p", { class: "muted", text: "Loading the week..." }));
  const bar = el("div", { class: "libbar" },
    el("span", { class: "meta" }, "Times in your time zone"),
    el("span", { class: "grow" }),
    state.signedIn ? slash([[true, "My list"], [false, "Everything"]], onlyMine, (v) => {
      onlyMine = v; store.set("anicat_schedule_all", v ? "0" : "1"); draw();
    }, "Which titles") : null);
  p.append(bar, days, list);

  let slots;
  try {
    slots = await api("GET", `/api/schedule?from=${from}&to=${from + 7 * 86400}`);
  } catch (e) {
    list.replaceChildren(el("p", { class: "error", text: errorText(e) }));
    return;
  }
  if (token !== state.renderToken) return;

  const dayOf = (s) => {
    const d = new Date(s.airing_at * 1000); d.setHours(0, 0, 0, 0);
    return Math.round((d.getTime() - start.getTime()) / 86400000);
  };
  function draw() {
    const shown = slots.filter((s) => !onlyMine || s.on_user_list);
    days.replaceChildren(...Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start.getTime() + i * 86400000);
      const count = shown.filter((s) => dayOf(s) === i).length;
      return el("button", { type: "button", "aria-pressed": String(i === day),
        onclick: () => { day = i; store.set("anicat_schedule_day_offset", String(i)); draw(); } },
        el("span", { class: "d" }, i === 0 ? "Today" : d.toLocaleDateString([], { weekday: "short" })),
        el("span", { class: "n" }, d.getDate()),
        el("span", { class: "c" }, count ? `${count} airing` : "none"));
    }));
    const today = shown.filter((s) => dayOf(s) === day).sort((a, b) => a.airing_at - b.airing_at);
    if (!today.length) {
      list.replaceChildren(el("p", { class: "empty", text: onlyMine ? "Nothing from your list airs this day." : "Nothing airs this day." }));
      return;
    }
    const now = Date.now() / 1000;
    const rows = [];
    let nowDrawn = day !== 0;
    for (const s of today) {
      if (!nowDrawn && s.airing_at > now) { rows.push(el("div", { class: "nowline" }, `Now, ${timeOf(now)}`)); nowDrawn = true; }
      const left = s.airing_at - now;
      rows.push(el("a", { class: "slot" + (s.airing_at <= now ? " past" : "") + (s.on_user_list ? " mine" : ""), href: titleHref("anilist", s.catalog_id) },
        el("time", {}, timeOf(s.airing_at)),
        img(s.cover_image),
        el("div", { style: "min-width:0" },
          el("div", { class: "t t-name" }, s.title),
          el("div", { class: "meta" }, `Episode ${s.episode}${s.episode_count ? ` of ${s.episode_count}` : ""}`,
            s.format ? el("span", { class: "dot" }, formatLabel(s.format)) : null,
            s.user_status ? el("span", { class: "dot", style: "color:var(--accent)" }, STATUS_LABELS[s.user_status] || humanize(s.user_status)) : null)),
        el("div", { class: "r meta" }, left > 0 ? `in ${until(left)}` : "Aired"),
      ));
    }
    list.replaceChildren(...rows);
  }
  draw();
}

function until(seconds) {
  const m = Math.round(seconds / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h ${m % 60} min`;
  return `${Math.floor(h / 24)} d ${h % 24} h`;
}

// ---- views: library ---------------------------------------------------------

const listMemo = new Map();
function userList(status, fresh) {
  if (!fresh && listMemo.has(status)) return listMemo.get(status);
  const p = api("GET", `/api/user-list?status=${status}`);
  listMemo.set(status, p);
  p.catch(() => listMemo.delete(status));
  setTimeout(() => listMemo.delete(status), 60_000);
  return p;
}

async function viewLibrary(host, token, statusArg) {
  const p = page(host);
  p.append(el("h1", {}, "Library"));
  if (state.mode === "anime" && !state.signedIn) { p.append(signInPrompt()); return; }
  const statuses = state.mode === "anime" ? ANIME_STATUSES : CINEMA_STATUSES;
  const status = statuses.includes(statusArg) ? statusArg : (store.get(`anicat_lib_${state.mode}`) || "CURRENT");
  store.set(`anicat_lib_${state.mode}`, status);
  let sort = store.get("anicat_lib_sort") || "updated";
  let filter = "";

  const tabs = el("div", { class: "statuses", role: "group", "aria-label": "Status" });
  const filterInput = el("input", { class: "field", type: "search", placeholder: "Filter", "aria-label": "Filter titles" });
  const body = el("div", {}, el("div", { class: "grid" }, Array.from({ length: 12 }, () => el("div", { class: "skel", style: "aspect-ratio:2/3" }))));
  const sortMenu = menu({ label: "Sort", value: sort,
    options: state.mode === "anime"
      ? [["updated", "Last updated"], ["title", "Title"], ["score", "Your score"], ["progress", "Progress"], ["airing", "Next airing"]]
      : [["updated", "Last added"], ["title", "Title"]],
    onChange: (v) => { sort = v; store.set("anicat_lib_sort", v); draw(); } });
  p.append(el("div", { class: "libbar" }, tabs, el("span", { class: "grow" }), filterInput, sortMenu), body);

  const counts = {};
  const drawTabs = () => tabs.replaceChildren(...statuses.map((s) => el("button", {
    type: "button", "aria-pressed": String(s === status), onclick: () => { location.hash = `#/library/${s}`; },
  }, STATUS_LABELS[s], counts[s] !== undefined ? el("span", { class: "count num" }, counts[s]) : null)));
  drawTabs();

  let items = [];
  if (state.mode === "anime") {
    // Counts for every tab, fetched alongside; the open tab comes first.
    for (const s of statuses.filter((x) => x !== status)) {
      userList(s).then((rows) => { counts[s] = rows.length; if (token === state.renderToken) drawTabs(); }, () => {});
    }
    try { items = await userList(status, true); counts[status] = items.length; drawTabs(); } catch (e) {
      body.replaceChildren(el("p", { class: "error", text: errorText(e) }));
      return;
    }
  } else {
    let entries;
    try { entries = await api("GET", "/api/cinema/list"); } catch (e) {
      body.replaceChildren(el("p", { class: "error", text: errorText(e) }));
      return;
    }
    for (const s of statuses) counts[s] = entries.filter((e) => e.status === s).length;
    drawTabs();
    const group = entries.filter((e) => e.status === status);
    const details = await mapLimited(group, 4, (e) => fetchDetail(e.catalog, e.catalog_id));
    items = group.map((e, i) => {
      const d = details[i];
      return d && !d.error
        ? { catalog: e.catalog, catalog_id: e.catalog_id, title: d.title, cover_image: d.cover_image, format: d.format, average_score: d.average_score, order: i }
        : { catalog: e.catalog, catalog_id: e.catalog_id, title: `Unavailable (${e.catalog} ${e.catalog_id})`, cover_image: "", order: i };
    });
  }
  if (token !== state.renderToken) return;

  function draw() {
    const q = filter.trim().toLowerCase();
    let rows = items.filter((m) => !q || m.title.toLowerCase().includes(q));
    const by = {
      updated: (a, b) => (b.updated_at || 0) - (a.updated_at || 0) || (a.order || 0) - (b.order || 0),
      title: (a, b) => a.title.localeCompare(b.title),
      score: (a, b) => (b.user_score || 0) - (a.user_score || 0),
      progress: (a, b) => ((b.progress || 0) / (b.episodes || 1e9)) - ((a.progress || 0) / (a.episodes || 1e9)),
      airing: (a, b) => (a.next_airing_at || Infinity) - (b.next_airing_at || Infinity),
    }[sort] || (() => 0);
    rows = rows.slice().sort(by);
    if (!rows.length) {
      body.replaceChildren(el("p", { class: "empty", text: items.length ? "No title matches the filter." :
        state.mode === "anime" ? `Nothing in ${STATUS_LABELS[status]}.` : "Nothing here yet. Add titles from their page." }));
      return;
    }
    const now = Date.now() / 1000;
    body.replaceChildren(grid(rows, (m) => {
      const bits = [];
      if (m.catalog === "anilist") {
        if (m.episodes) bits.push(`${m.progress || 0} / ${m.episodes}`);
        else if (m.progress) bits.push(`${m.progress} seen`);
        if (m.next_airing_at && m.next_airing_at > now) bits.push(`Ep ${m.next_episode} in ${until(m.next_airing_at - now)}`);
        else if (m.released_episodes && (m.progress || 0) < m.released_episodes) bits.push(`${m.released_episodes - (m.progress || 0)} new`);
      } else {
        bits.push(m.catalog === "tmdb_tv" ? "Series" : "Film");
      }
      return { sub: bits.join(" · "), score: m.user_score ? String(m.user_score) : null };
    }));
  }
  filterInput.addEventListener("input", () => { filter = filterInput.value; draw(); });
  draw();
}

function signInPrompt() {

    el("span", { style: "flex:1;min-width:240px" }, "Sign in to AniList to see your list and sync what you watch."),
    el("a", { class: "btn primary", href: "#/signin" }, "Sign in"));
}

async function viewSearch(host, token, query) {
  const p = page(host);
  const anime = state.mode === "anime";
  p.append(el("h1", {}, anime ? "Search anime" : "Search films and TV"));
  const input = el("input", { type: "search", value: query || "", placeholder: anime ? "Titles, studios, genres" : "Films and series", "aria-label": "Search", autocomplete: "off", spellcheck: "false" });
  p.append(el("div", { class: "searchbar" }, icon("search"), input, el("kbd", {}, "/")));
  const filtersHost = el("div", { class: "filters" });
  const results = el("div", {});
  p.append(filtersHost, results);
  input.focus();
  if (query) input.setSelectionRange(query.length, query.length);

  const saved = (() => { try { return JSON.parse(store.get(`anicat_filters_${state.mode}`) || "{}"); } catch { return {}; } })();
  const f = Object.assign({}, saved);
  const persist = () => store.set(`anicat_filters_${state.mode}`, JSON.stringify(f));
  const opt = (list) => [["", "Any"], ...list];
  const year = new Date().getFullYear();
  const years = opt(Array.from({ length: year - 1969 + 1 }, (_, i) => [String(year + 1 - i), String(year + 1 - i)]));

  let seq = 0;
  async function run() {
    const mine = ++seq;
    const q = input.value.trim();
    const anyFilter = Object.values(f).some(Boolean);
    // The address follows the query, without a history entry per keystroke.
    history.replaceState(null, "", q ? `#/search/${encodeURIComponent(q)}` : "#/search");
    if (!q && !anyFilter && anime) {
      results.replaceChildren();
      shelf(results, "Popular this season", async () =>
        (await api("GET", "/api/discover?status=RELEASING&limit=24")).map((r) => posterCard(r, { score: scoreOf(r) })));
      shelf(results, "All-time popular", async () =>
        (await api("POST", "/api/search", { query: "", kind: "anime" })).map((r) => posterCard(r, { score: scoreOf(r) })));
      return;
    }
    results.replaceChildren(el("div", { class: "grid" }, Array.from({ length: 12 }, () => el("div", { class: "skel", style: "aspect-ratio:2/3" }))));
    try {
      let rows;
      if (anime) {
        const filters = {
          genre: f.genre || null, year: f.year ? Number(f.year) : null, season: f.year && f.season ? f.season : null,
          format: f.format || null, status: f.status || null, country: f.country || null, sort: f.sort || null,
          min_score: f.min_score ? Number(f.min_score) : null,
        };
        rows = await api("POST", "/api/search", { query: q, kind: "anime", filters, limit: 30 });
      } else if (q) {
        rows = await api("POST", "/api/search", { query: q, kind: "cinema", limit: 30 });
      } else {
        const qs = new URLSearchParams({ series: f.kind === "tv" ? "true" : "false" });
        if (f.genre) qs.set("genre", f.genre);
        if (f.year) qs.set("year", f.year);
        rows = await api("GET", `/api/cinema/discover?${qs}`);
      }
      if (mine !== seq || token !== state.renderToken) return;
      results.replaceChildren(rows.length
        ? grid(rows, (r) => ({ score: scoreOf(r) }))
        : el("p", { class: "empty", text: q ? `Nothing found for "${q}".` : "Nothing matches these filters." }));
    } catch (e) {
      if (mine === seq) results.replaceChildren(el("p", { class: "error", text: errorText(e) }));
    }
  }

  let timer = null;
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 320); });
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); clearTimeout(timer); run(); }
  });

  const set = (key) => (v) => { if (v) f[key] = v; else delete f[key]; persist(); drawFilters(); run(); };
  async function drawFilters() {
    const menus = [];
    if (anime) {
      menus.push(
        menu({ label: "Genre", value: f.genre || "", options: opt(GENRES.map((g) => [g, g])), onChange: set("genre") }),
        menu({ label: "Year", value: f.year || "", options: years, onChange: set("year") }),
        // AniList ignores a season with no year; offering one then filtered nothing.
        f.year ? menu({ label: "Season", value: f.season || "", options: opt([["WINTER", "Winter"], ["SPRING", "Spring"], ["SUMMER", "Summer"], ["FALL", "Fall"]]), onChange: set("season") }) : null,
        menu({ label: "Format", value: f.format || "", options: opt(Object.entries(FORMAT_LABELS)), onChange: set("format") }),
        menu({ label: "Status", value: f.status || "", options: opt([["RELEASING", "Releasing"], ["FINISHED", "Finished"], ["NOT_YET_RELEASED", "Not yet released"], ["HIATUS", "Hiatus"], ["CANCELLED", "Cancelled"]]), onChange: set("status") }),
        menu({ label: "Origin", value: f.country || "", options: opt([["JP", "Japan"], ["KR", "Korea"], ["CN", "China"]]), onChange: set("country") }),
        menu({ label: "Score", value: f.min_score || "", options: opt([["90", "90+"], ["80", "80+"], ["70", "70+"], ["60", "60+"]]), onChange: set("min_score") }),
        menu({ label: "Sort", value: f.sort || "", options: [["", "Popularity"], ["SCORE_DESC", "Score"], ["TRENDING_DESC", "Trending"], ["START_DATE_DESC", "Newest"], ["TITLE_ROMAJI", "Title"]], onChange: set("sort") }),
      );
    } else {
      menus.push(el("span", { class: "meta" }, "With an empty search, browse:"),
        slash([["movie", "Films"], ["tv", "Series"]], f.kind || "movie", set("kind"), "Kind"));
      let genres = [];
      try { genres = await api("GET", `/api/cinema/genres?series=${f.kind === "tv"}`); } catch { /* browse without genres */ }
      menus.push(
        menu({ label: "Genre", value: f.genre || "", options: opt(genres.map((g) => [String(g.id), g.name])), onChange: set("genre") }),
        menu({ label: "Year", value: f.year || "", options: years, onChange: set("year") }));
    }
    const any = Object.keys(f).some((k) => f[k] && k !== "kind");
    // replaceChildren, unlike el(), writes a null out as the text "null".
    filtersHost.replaceChildren(...[...menus,
      any ? el("button", { type: "button", class: "lk clear", text: "Clear filters", onclick: () => {
        for (const k of Object.keys(f)) if (k !== "kind") delete f[k];
        persist(); drawFilters(); run();
      } }) : null].filter(Boolean));
  }
  drawFilters();
  run();
}
