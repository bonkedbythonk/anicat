[package]
name = "anicat"
version = "5.4.5"
license = "GPL-3.0-only"
edition = "2021"
# Without this, adding the anicat-server [[bin]] below makes `cargo run`
# (which tauri dev / tauri build shell out to) ambiguous between it and the
# implicit main.rs binary.
default-run = "anicat"

# Headless self-hosted build (see PI_SETUP.md) — no Tauri window/event loop,
# just the same AppState/proxy/scraper machinery run standalone. Named with a
# hyphen (Cargo's default for src/bin/anicat_server.rs would be the
# underscored file stem) purely so the produced binary reads naturally on
# the command line and in the systemd unit.
[[bin]]
name = "anicat-server"
path = "src/bin/anicat_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-util = "0.3"
http = "1"
thiserror = "2"
dirs = "6"
open = "5"
discord-rich-presence = "0.2"
sha2 = "0.10"
# disable-upload: this is a personal streaming client, not a seedbox — we
# download to watch and never upload. Also silences the bulk of the peer
# churn that librqbit logs.
# default-features off + rust-tls: librqbit's default "default-tls" feature
# enables reqwest/default-tls (native-tls) crate-graph-wide, which flips
# reqwest::Client::new() from rustls to macOS SecureTransport — and
# api.aniskip.com's TLS handshake fails under SecureTransport, silently
# breaking AniSkip for every provider. Keep the whole app on rustls.
librqbit = { version = "8", default-features = false, features = ["disable-upload", "rust-tls"] }
regex-lite = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
# Installed with an off-by-default filter purely to capture librqbit/DHT's
# `tracing` events, which otherwise fall back to the `log` facade and flood
# the console via tauri-plugin-log. default-features off / no "tracing-log":
# that feature makes try_init() also call tracing_log::LogTracer::init(),
# which grabs the global `log` logger before tauri-plugin-log's own init runs
# and panics ("attempted to set a logger after the logging system was already
# initialized"). We only want tracing_subscriber consuming tracing events
# directly — the log crate is entirely tauri-plugin-log's to own.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[profile.dev]
opt-level = 1
