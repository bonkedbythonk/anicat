# AniCat keybinds. Two groups, one rule each:
#   Ctrl+<number>  -> persisted app settings (also update the real Settings
#                     screen, not just this mpv session)
#   Shift+<letter> -> one-shot / session playback actions. mpv normalizes
#                     Shift+<letter> to the capital letter itself (see mpv's
#                     "Key names" docs), so e.g. the line below reading "R"
#                     is the Shift+R binding, not a bare unshifted r.
#
# --- Settings (Ctrl+number) ---
# ctrl+1 -> Toggle upscaling on/off
# ctrl+2 -> Toggle auto-skip intro on/off
# ctrl+4 -> Toggle auto-play next episode on/off
#
# --- Actions (Shift+letter) ---
# Shift+R -> Reload episode
# Shift+S -> Skip intro / active skip segment
# Shift+T -> Toggle sub / dub
# Shift+V -> Sideways mode: cycle video rotation off / 90 CW / 90 CCW

# --- Settings ---
ctrl+1 script-message anicat-toggle-shaders
ctrl+2 script-message anicat-toggle-autoskip
ctrl+4 script-message anicat-toggle-auto-next

# --- Actions ---
# Shift+S is intentionally absent here: main.lua force-binds it directly
# (mp.add_forced_key_binding), which needs the forced form so it can't be
# shadowed by a future user input.conf. A regular binding here would just
# be a dead duplicate of that one.
R script-message anicat-reload-episode
N script-message anicat-next-episode
P script-message anicat-previous-episode
T script-message anicat-toggle-translation
V script-message anicat-toggle-sideways
