# AniCat Upscaling
# ctrl+1 -> Toggle upscaling (Anime4K CNN Mode A)

# AniCat playback controls
# R -> Reload Episode
# A -> Toggle Auto-play
# T -> Toggle Dub / Sub
# S -> Skip Intro / Active Skip Segment

# --- Upscaling toggle ---
ctrl+1 script-message anicat-toggle-shaders

# --- AniCat playback actions ---
R script-message anicat-reload-episode
A script-message anicat-toggle-auto-next
T script-message anicat-toggle-translation
S script-message anicat-skip-intro


