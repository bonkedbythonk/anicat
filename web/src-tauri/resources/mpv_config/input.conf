# AniCat Upscaling (session-only — does NOT change your saved setting in Anicat)
# ctrl+1 -> Off
# ctrl+2 -> Eco
# ctrl+3 -> Balanced
# ctrl+4 -> Sharp

# AniCat playback controls
# R -> Reload Episode
# A -> Toggle Auto-play
# T -> Toggle Dub / Sub
# S -> Skip Intro / Active Skip Segment

# --- Upscaling profiles (temporary, no config write) ---
ctrl+1 script-message anicat-set-upscaling off
ctrl+2 script-message anicat-set-upscaling eco
ctrl+3 script-message anicat-set-upscaling balanced
ctrl+4 script-message anicat-set-upscaling sharp

# --- AniCat playback actions ---
R script-message anicat-reload-episode
A script-message anicat-toggle-auto-next
T script-message anicat-toggle-translation
S script-message anicat-skip-intro


