# AniCat Upscaling
# ctrl+1 -> Cycle upscaling quality: Off → Eco → Balanced → Sharp → Off
#           Session-only — does NOT change your saved setting in Anicat

# AniCat playback controls
# R -> Reload Episode
# A -> Toggle Auto-play
# T -> Toggle Dub / Sub
# S -> Skip Intro / Active Skip Segment

# --- Upscaling cycle (temporary, no config write) ---
ctrl+1 script-message anicat-cycle-upscaling

# --- AniCat playback actions ---
R script-message anicat-reload-episode
A script-message anicat-toggle-auto-next
T script-message anicat-toggle-translation
S script-message anicat-skip-intro


