# Video Quality Settings
vo=gpu
profile=high-quality
hwdec=auto-safe

# Complete Borderless Minimalism
border=no
osc=no
osd-level=1
osd-on-seek=no
osd-bar=no

# Playback
# Show last frame instead of black screen when episode ends
keep-open=yes
# Remember volume, position, and other settings between launches
save-position-on-quit=no
# Start in fullscreen by default
fullscreen=yes
# Prevents sub_margins conflict from watch-later restore
watch-later-options-remove=sub-pos
# Cache for smooth streaming on slow connections
demuxer-max-bytes=128M
demuxer-readahead-secs=15
cache-pause=yes

# Subtitles
sub-auto=fuzzy
sub-font="Outfit"
sub-font-size=44
sub-bold=yes
