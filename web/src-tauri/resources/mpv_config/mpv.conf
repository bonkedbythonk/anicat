# Video Quality Settings
vo=gpu
# Hardware-decode on macOS (VideoToolbox). Keeps arrow-key seeks cheap: the
# earlier hwdec=no forced a CPU decode burst on every seek that stalled the
# playloop and crackled the audio — the opposite of what it was meant to fix.
hwdec=auto-safe
# Persist compiled shaders across sessions so the first Ctrl+1 upscaling toggle
# doesn't stall recompiling the Anime4K chain (~~cache/ is a writable per-user
# dir; the app bundle's config dir is read-only).
gpu-shader-cache-dir=~~cache/

# Complete Borderless Minimalism
border=no
osc=no
osd-level=1
osd-on-seek=no
osd-bar=no

# Playback
# Show last frame instead of black screen when episode ends
keep-open=yes
# Remember volume, position, and other settings between launches
save-position-on-quit=no
# Start in fullscreen by default
fullscreen=yes
# Prevents sub_margins conflict from watch-later restore
watch-later-options-remove=sub-pos
# Cache for smooth streaming on slow connections
demuxer-max-bytes=128M
demuxer-readahead-secs=15
cache-pause=yes

# Subtitles
sub-auto=fuzzy
sub-font="Outfit"
sub-font-size=44
sub-bold=yes

# Audio
# AVFoundation output (AVSampleBufferAudioRenderer) instead of the default
# coreaudio AudioUnit AO. The AudioUnit AO stops/starts the device on every
# pause and seek, and CoreAudio pops on those transitions — reproducible with
# vanilla mpv on a local file, so it was never an anicat pipeline issue. The
# AVFoundation renderer keeps the pipeline alive across pause/seek and handles
# sample-rate/device changes itself, which also replaces two old workarounds:
# audio-stream-silence=yes (mpv warns it "will break certain player
# behavior") and the
# audio-samplerate=48000 pin (which forced a pointless 44.1->48kHz resample on
# most web sources). The trailing comma matters: this config also ships on
# Windows/Linux where avfoundation doesn't exist, and a bare ao=<driver> that
# fails to load disables audio entirely — the comma makes mpv fall back to the
# platform default AO instead.
ao=avfoundation,
# Generous soft buffer — the default is only 0.2s. A brief pipeline stall (a
# seek, or the Anime4K render-graph rebuild on a Ctrl+1 upscaling toggle) was
# draining that tiny buffer faster than it refilled, starving the output device
# into a crackle. 0.5 removed most of it; 1.0 covers the occasional residual
# underrun that still slipped through on longer stalls.
audio-buffer=1.0
# MacBook built-in speakers are a 2-channel device, so a 5.1/7.1 anime audio
# track (common on BD-quality releases) gets downmixed on the fly. mpv's
# default downmix just sums the surround channels into L/R with no headroom,
# which clips and reads as crackle/distortion — audible on the built-in
# speakers' limited amp but easy to miss on headphones or external speakers
# where the same clipped signal has more room. This applies -3dB-ish
# normalization to the downmix so it stays under 0dBFS.
audio-normalize-downmix=yes
# Force stereo output regardless of source track or device. Without this,
# mpv only downmixes when CoreAudio reports the output device as 2-channel
# (true for MacBook speakers, per the note above) — AirPods and similar
# spatial-audio-capable headphones report as accepting more channels, so that
# conditional downmix never triggers and a 5.1/7.1 audio track (common on
# BD-quality anime releases) passes straight through avfoundation as real
# multichannel audio. macOS then auto-engages Spatial Audio with head
# tracking the moment it sees that, unrequested. Forcing the channel layout
# here makes mpv do its own downmix before avfoundation ever sees more than
# 2 channels, so the OS has nothing to spatialize.
audio-channels=stereo
